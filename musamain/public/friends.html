<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Friends - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="friends.css">
</head>

<body>
    <main class="friends-page">
        <section class="friends-shell">
            <header class="friends-hero">
                <div class="friends-hero-text">
                    <h1>Friends</h1>
                    <p>Compare streaks, play chess, celebrate progress.</p>
                </div>
                <div class="friends-hero-actions">
                    <a class="btn-ghost" href="dashboard.html">← Dashboard</a>
                    <a class="btn-ghost" href="matches.html">♟ Play chess</a>
                </div>
            </header>

            <div class="friends-content">
                <div id="signinNotice" class="signin-notice" style="display:none;">
                    You're browsing as a guest. Sign in to add friends and play chess together.
                    <a href="signin.html">Sign in →</a>
                </div>

                <section class="side-card">
                    <h2>Connect with a friend</h2>
                    <form id="friendForm" class="add-form" autocomplete="off">
                        <input id="friendEmail" type="email" placeholder="Friend's email" required />
                        <button type="submit" id="addFriendBtn">Send request</button>
                    </form>
                    <div id="friendMessage" class="message" aria-live="polite"></div>
                </section>

                <section class="side-card" id="incomingPanel" style="display:none;">
                    <h2>Incoming requests <span class="pill-badge" id="incomingCount">0</span></h2>
                    <div class="friend-list" id="incomingList"></div>
                </section>

                <section class="side-card" id="outgoingPanel" style="display:none;">
                    <h2>Sent requests</h2>
                    <div class="friend-list" id="outgoingList"></div>
                </section>

                <section class="side-card" id="friends">
                    <h2>
                        Your friends
                        <span class="pill-badge" id="friendsCount" hidden>0</span>
                        <button type="button" class="icon-btn" id="refreshFriends" title="Refresh"
                            aria-label="Refresh friends">↻</button>
                    </h2>
                    <div class="friend-list" id="friendsList"></div>
                </section>
            </div>
        </section>
    </main>

    <script src="sounds.js"></script>
    <script type="module" src="friends.js"></script>
    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
