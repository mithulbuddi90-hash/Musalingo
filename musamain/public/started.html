<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        :root {
            --bg: #0f0a1e;
            --card: #1a1030;
            --card2: #221640;
            --text: #f0eaff;
            --muted: #9d8fc0;
            --accent: #c084fc;
            --accent-glow: #a855f7;
            --pink: #f472b6;
            --border: rgba(192, 132, 252, 0.18);
            --input-bg: #130d26;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            position: relative;
            overflow-x: hidden;
        }

        body::before {
            content: '♩ ♪ ♫ ♬ ♩ ♪ ♫ ♬ ♩ ♪ ♫ ♬';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            font-size: 1.4rem;
            color: rgba(192, 132, 252, 0.05);
            letter-spacing: 2.5rem;
            line-height: 4rem;
            word-break: break-all;
            pointer-events: none;
            z-index: 0;
        }

        .card {
            position: relative;
            z-index: 1;
            width: min(460px, 100%);
            background: var(--card);
            border-radius: 28px;
            padding: 36px 32px;
            border: 1px solid var(--border);
            box-shadow: 0 0 60px rgba(168, 85, 247, 0.15), 0 24px 48px rgba(0, 0, 0, 0.5);
        }

        .logo-row {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .logo-icon {
            width: 38px;
            height: 38px;
            background: linear-gradient(135deg, var(--accent), var(--pink));
            border-radius: 10px;
            display: grid;
            place-items: center;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .brand {
            font-size: 1.75rem;
            font-weight: 800;
            background: linear-gradient(90deg, var(--accent), var(--pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            line-height: 1;
        }

        .subtitle {
            color: var(--muted);
            font-size: 0.9rem;
            margin-bottom: 26px;
            margin-top: 4px;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 16px 0;
            color: var(--muted);
            font-size: 0.78rem;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        form {
            display: grid;
            gap: 12px;
        }

        label {
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--muted);
            display: block;
            margin-bottom: 4px;
        }

        .field {
            display: grid;
        }

        input {
            width: 100%;
            padding: 11px 14px;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            font-size: 0.95rem;
            font-family: inherit;
            color: var(--text);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input::placeholder {
            color: rgba(157, 143, 192, 0.4);
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(192, 132, 252, 0.15);
        }

        .btn {
            margin-top: 6px;
            padding: 13px 16px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, var(--accent-glow), var(--pink));
            color: white;
            font-size: 0.98rem;
            font-weight: 700;
            font-family: inherit;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            box-shadow: 0 4px 20px rgba(168, 85, 247, 0.4);
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(168, 85, 247, 0.5);
        }

        .btn:active {
            transform: translateY(1px);
        }

        .oauth-btn {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 12px;
            background: var(--card2);
            color: var(--text);
            font-size: 0.92rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .oauth-btn:hover {
            background: #2a1d50;
            border-color: var(--accent);
        }

        .link-btn {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 0.88rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            padding: 4px 0;
            display: block;
            width: 100%;
            text-align: center;
            margin-top: 4px;
        }

        .link-btn:hover {
            color: var(--pink);
        }

        .message {
            margin-top: 10px;
            padding: 10px 14px;
            border-radius: 10px;
            font-size: 0.87rem;
            display: none;
            line-height: 1.5;
        }

        .message.error {
            display: block;
            background: rgba(239, 68, 68, 0.12);
            color: #fca5a5;
            border: 1px solid rgba(239, 68, 68, 0.3);
        }

        .message.success {
            display: block;
            background: rgba(192, 132, 252, 0.1);
            color: var(--accent);
            border: 1px solid var(--border);
        }

        .message a {
            color: inherit;
            font-weight: 700;
        }

        .footer {
            margin-top: 18px;
            text-align: center;
            color: var(--muted);
            font-size: 0.87rem;
        }

        .footer a {
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
        }

        .footer a:hover {
            color: var(--pink);
        }

        .demo-info {
            font-size: 0.8rem;
            color: var(--muted);
            background: var(--card2);
            padding: 8px 12px;
            border-radius: 8px;
            margin-top: 10px;
        }

        .phone-box {
            margin-top: 14px;
            border: 1px solid var(--border);
            border-radius: 16px;
            background: var(--card2);
            padding: 14px;
        }

        .phone-box strong {
            font-size: 0.88rem;
            color: var(--accent);
        }

        .phone-box input {
            margin-top: 8px;
        }

        .hidden {
            display: none;
        }

        .oauth-grid {
            display: grid;
            gap: 10px;
            margin-top: 4px;
        }

        @media (max-width: 500px) {
            body {
                padding: 14px;
            }

            .card {
                padding: 24px 16px;
                border-radius: 20px;
            }

            .brand {
                font-size: 1.45rem;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="auth-page">
    <div class="card">
        <div class="logo-row">
            <div class="logo-icon">μ</div>
            <div class="brand">Musalingo</div>
        </div>
        <div class="subtitle">Create your account and start your learning journey.</div>

        <form id="signupForm">
            <div class="field"><label for="name">Full name</label>
                <input id="name" name="name" type="text" placeholder="Your full name" required />
            </div>

            <div class="field"><label for="email">Email</label>
                <input id="email" name="email" type="email" placeholder="you@example.com" required />
            </div>

            <div class="field"><label for="password">Password</label>
                <input id="password" name="password" type="password" placeholder="Min. 6 characters" required />
            </div>

            <button class="btn" type="submit">Create Account</button>
        </form>

        <div id="message" class="message"></div>

        <div class="divider">or</div>
        <div class="oauth-grid">
            <button class="oauth-btn" id="googleBtn" type="button"><svg width="18" height="18" viewBox="0 0 48 48">
                    <path fill="#EA4335"
                        d="M24 9.5c3.5 0 6.6 1.2 9.1 3.2l6.8-6.8C35.8 2.5 30.2 0 24 0 14.7 0 6.7 5.5 2.7 13.6l7.9 6.1C12.5 13.3 17.8 9.5 24 9.5z" />
                    <path fill="#4285F4"
                        d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v8.5h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4 6.9-10 6.9-17z" />
                    <path fill="#FBBC05"
                        d="M10.6 28.3A14.5 14.5 0 0 1 9.5 24c0-1.5.2-2.9.6-4.3l-7.9-6.1A23.9 23.9 0 0 0 0 24c0 3.9.9 7.5 2.6 10.8l8-6.5z" />
                    <path fill="#34A853"
                        d="M24 48c6.2 0 11.4-2 15.2-5.5l-7.5-5.8c-2.1 1.4-4.7 2.3-7.7 2.3-6.2 0-11.5-4.2-13.4-9.9l-8 6.2C6.7 42.5 14.7 48 24 48z" />
                </svg> Continue with Google</button>
            <!-- <button class="oauth-btn" id="microsoftBtn" type="button"
                style="border:1px solid #e5e7eb;background:#fff;border-radius:12px;padding:12px 14px;font-weight:700;cursor:pointer;">Continue
                with Microsoft</button> -->
            <button class="link-btn" id="guestBtn" type="button">Continue as guest</button>
        </div>



        <div class="footer">
            Already have an account? <a href="signin.html">Sign in</a>
        </div>
    </div>

    <script>
        (() => {
            const messageBox = document.getElementById('message');
            const showSetupMessage = () => {
                messageBox.textContent = 'Account creation requires the Musalingo server. Run npm start from the musamain folder, then open ';
                const link = document.createElement('a');
                link.href = 'http://localhost:3000/started.html';
                link.textContent = 'http://localhost:3000/started.html';
                link.style.color = 'inherit';
                link.style.fontWeight = '700';
                messageBox.append(link, document.createTextNode('.'));
                messageBox.className = 'message error';
            };

            if (location.protocol === 'file:') {
                showSetupMessage();
                document.getElementById('signupForm').addEventListener('submit', event => event.preventDefault());
                document.querySelector('#signupForm button[type="submit"]').disabled = true;
                document.getElementById('googleBtn').disabled = true;
                document.getElementById('guestBtn').addEventListener('click', () => {
                    localStorage.setItem('MusalingoGuest', 'true');
                    localStorage.setItem('MusalingoLoggedIn', 'false');
                    localStorage.removeItem('MusalingoUser');
                    localStorage.removeItem('MusalingoUid');
                    let profile = {};
                    try {
                        profile = JSON.parse(localStorage.getItem('MusalingoProfile') || '{}');
                    } catch (error) {
                        console.warn('[signup] Could not read the local profile for guest navigation.', error);
                    }
                    location.href = Array.isArray(profile.courses) && profile.courses.length
                        ? 'dashboard.html'
                        : 'catalog.html';
                });
                return;
            }

            window.addEventListener('error', event => {
                if (window.musalAuthReady) return;
                console.error('[signup] Could not initialize authentication.', event.error || event.message);
                messageBox.textContent = 'Account creation could not start. Check your connection and make sure the Musalingo server is running, then reload this page.';
                messageBox.className = 'message error';
            });
        })();
    </script>
    <script type="module">
        import {
            auth,
            clearGuestMode,
            setGuestMode,
            upsertSignedInUserDocument,
            createUserWithEmailAndPassword,
            updateProfile,
            signInWithGooglePopup,
            // signInWithMicrosoftPopup,
            loadLocalProfile
        } from './firebase.js';
        const form = document.getElementById('signupForm');
        const messageBox = document.getElementById('message');
        const guestBtn = document.getElementById('guestBtn');
        const googleBtn = document.getElementById('googleBtn');
        // const microsoftBtn = document.getElementById('microsoftBtn');

        function showMessage(text, type) {
            messageBox.textContent = text;
            messageBox.className = `message ${type}`;
        }

        function redirectAfterAuth() {
            const profile = loadLocalProfile();
            const hasCourses = Array.isArray(profile.courses) && profile.courses.length > 0;
            window.location.href = hasCourses ? 'dashboard.html' : 'catalog.html';
        }

        async function finishAuthCreate(user, displayName = 'Learner') {
            const profile = loadLocalProfile();
            await upsertSignedInUserDocument(user.uid, user.email || `${user.uid}@auth.local`, {
                ...profile,
                name: displayName || profile.name || 'Learner',
                email: user.email || `${user.uid}@auth.local`,
                friends: Array.isArray(profile.friends) ? profile.friends : [],
                courses: Array.isArray(profile.courses) ? profile.courses : [],
                inventory: Array.isArray(profile.inventory) ? profile.inventory : []
            });
            clearGuestMode();
            localStorage.setItem('MusalingoLoggedIn', 'true');
            localStorage.setItem('MusalingoUser', user.email || `${user.uid}@auth.local`);

            // Send welcome email on first login (silent — never blocks sign-up)
            if (user.email) {
                try {
                    const token = await user.getIdToken();
                    fetch('/api/welcome', {
                        method: 'POST',
                        headers: { Authorization: `Bearer ${token}` }
                    }).catch(() => { });
                } catch (_) { }
            }

            redirectAfterAuth();
        }

        guestBtn.addEventListener('click', function () {
            setGuestMode();
            localStorage.removeItem('MusalingoLoggedIn');
            localStorage.removeItem('MusalingoUser');
            redirectAfterAuth();
        });

        googleBtn.addEventListener('click', async function () {
            try {
                const result = await signInWithGooglePopup();
                await finishAuthCreate(result.user, result.user.displayName || 'Google user');
            } catch (error) {
                showMessage(error.message || 'Google sign-up failed.', 'error');
            }
        });

        // microsoftBtn.addEventListener('click', async function () {
        //     try {
        //         const result = await signInWithMicrosoftPopup();
        //         await finishAuthCreate(result.user, result.user.displayName || 'Microsoft user');
        //     } catch (error) {
        //         showMessage(error.message || 'Microsoft sign-up failed.', 'error');
        //     }
        // });

        form.addEventListener('submit', function (event) {
            event.preventDefault();

            const name = document.getElementById('name').value.trim();
            const email = document.getElementById('email').value.trim().toLowerCase();
            const password = document.getElementById('password').value;

            if (!name || !email || !password) {
                showMessage('Please fill in all fields.', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Password must be at least 6 characters long.', 'error');
                return;
            }

            createUserWithEmailAndPassword(auth, email, password)
                .then(async (userCredential) => {
                    await updateProfile(userCredential.user, { displayName: name });
                    await finishAuthCreate(userCredential.user, name);
                    showMessage(`Account created successfully for ${userCredential.user.email}!`, 'success');
                    form.reset();
                })
                .catch((error) => {
                    const code = error?.code || '';
                    const message = code === 'auth/email-already-in-use'
                        ? 'An account already exists for that email. Sign in instead.'
                        : code === 'auth/weak-password'
                            ? 'Password must be at least 6 characters long.'
                            : error.message || 'Unable to create account right now.';
                    showMessage(message, 'error');
                });
        });
        window.musalAuthReady = true;
    </script>
    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>

</body>

</html>
