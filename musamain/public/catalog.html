<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Courses - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">
    <style>
        :root {
            --bg: #ffffff;
            --bg-soft: #f7f7f7;
            --card: #ffffff;
            --text: #3c3c3c;
            --text-strong: #1f1f1f;
            --muted: #777777;
            --accent: #EC96C7;
            --accent-dark: #F490C3;
            --border: #e5e5e5;
            --hover: #f7f7f7;
            --shadow: 0 2px 0 rgba(0, 0, 0, 0.06);
        }

        body.dark-mode {
            --bg: #131f24;
            --bg-soft: #0f181c;
            --card: #1c2a30;
            --text: #e5e7eb;
            --text-strong: #f1f7fb;
            --muted: #8a9aa6;
            --border: #2f3e46;
            --hover: #22333a;
        }

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
        }

        /* ---------- TOP BAR ---------- */
        .topbar {
            position: sticky;
            top: 0;
            z-index: 30;
            background: var(--bg);
            border-bottom: 2px solid var(--border);
            padding: 14px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 900;
            letter-spacing: -0.04em;
            color: var(--accent);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            font-weight: 900;
        }

        .topbar-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .top-btn {
            padding: 10px 16px;
            border-radius: 12px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-weight: 800;
            font-size: 0.85rem;
            text-decoration: none;
            cursor: pointer;
            transition: background 0.15s ease, border-color 0.15s ease;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .top-btn:hover {
            background: var(--hover);
            border-color: var(--accent);
        }

        .top-btn.primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
            box-shadow: 0 4px 0 var(--accent-dark);
        }

        .top-btn.primary:hover {
            filter: brightness(1.05);
        }

        /* ---------- PAGE ---------- */
        .page {
            max-width: 1120px;
            margin: 0 auto;
            padding: 40px 24px 80px;
        }

        .page h1 {
            margin: 0 0 8px;
            font-size: clamp(1.8rem, 3vw, 2.4rem);
            color: var(--text-strong);
            font-weight: 900;
            letter-spacing: -0.03em;
        }

        .page p.lead {
            margin: 0 0 28px;
            color: var(--muted);
            font-size: 1rem;
            font-weight: 600;
            max-width: 640px;
        }

        /* ---------- FILTER TABS ---------- */
        .filter-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 28px;
            padding-bottom: 4px;
            overflow-x: auto;
        }

        .filter-tab {
            padding: 10px 18px;
            border-radius: 999px;
            border: 2px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-weight: 800;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.15s ease;
            font-family: inherit;
        }

        .filter-tab:hover {
            background: var(--hover);
            border-color: var(--accent);
        }

        .filter-tab.active {
            background: color-mix(in srgb, var(--accent) 15%, var(--bg));
            border-color: var(--accent);
            color: var(--accent-dark);
        }

        /* ---------- LANGUAGE GRID ---------- */
        .section-label {
            margin: 32px 0 16px;
            font-size: 0.85rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--muted);
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 16px;
        }

        /* ---------- COURSE CARD ---------- */
        .course-card {
            position: relative;
            padding: 22px 18px 18px;
            border-radius: 18px;
            border: 2px solid var(--border);
            background: var(--card);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease;
            display: flex;
            flex-direction: column;
            min-height: 170px;
            overflow: hidden;
        }

        .course-card:hover {
            transform: translateY(-3px);
            border-color: var(--accent);
            box-shadow: 0 8px 0 color-mix(in srgb, var(--accent) 30%, transparent);
        }

        .course-card:active {
            transform: translateY(1px);
            box-shadow: 0 2px 0 color-mix(in srgb, var(--accent) 30%, transparent);
        }

        .course-flag {
            font-size: 2.8rem;
            line-height: 1;
            margin-bottom: 12px;
            user-select: none;
        }

        .course-name {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-strong);
            margin-bottom: 4px;
            line-height: 1.2;
        }

        .course-learners {
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--muted);
            margin-bottom: auto;
        }

        .course-badge {
            display: inline-block;
            margin-top: 10px;
            padding: 4px 10px;
            border-radius: 6px;
            background: color-mix(in srgb, var(--accent) 15%, var(--bg));
            color: var(--accent-dark);
            font-size: 0.72rem;
            font-weight: 900;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            width: fit-content;
        }

        /* ---------- EMPTY / ERROR ---------- */
        .empty-state {
            padding: 32px;
            border-radius: 18px;
            background: var(--bg-soft);
            border: 2px solid var(--border);
            text-align: center;
            color: var(--muted);
            font-weight: 700;
        }

        .empty-state a {
            color: var(--accent-dark);
            font-weight: 800;
            text-decoration: underline;
        }

        /* ---------- INTERVIEW MODAL ---------- */
        .interview-backdrop {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: grid;
            place-items: center;
            padding: 20px;
            background: rgba(31, 41, 55, 0.55);
        }

        .interview-backdrop[hidden] {
            display: none;
        }

        .interview {
            width: min(480px, 100%);
            max-height: calc(100vh - 40px);
            overflow: auto;
            padding: 28px;
            border-radius: 24px;
            background: var(--card);
            color: var(--text);
            box-shadow: 0 24px 70px rgba(15, 23, 42, 0.3);
        }

        .interview h2 {
            margin: 0 0 6px;
            color: var(--text-strong);
            font-size: 1.3rem;
            font-weight: 900;
        }

        .interview p {
            margin: 0 0 20px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.95rem;
        }

        .interview-fields {
            display: grid;
            gap: 14px;
        }

        .interview label {
            display: grid;
            gap: 7px;
            font-weight: 800;
            font-size: 0.9rem;
            color: var(--text-strong);
        }

        .interview select {
            width: 100%;
            padding: 12px 14px;
            border: 2px solid var(--border);
            border-radius: 12px;
            background: var(--bg);
            color: var(--text);
            font: inherit;
            font-weight: 600;
            cursor: pointer;
        }

        .interview select:focus {
            outline: none;
            border-color: var(--accent);
        }

        .interview-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 22px;
        }

        .interview-cancel {
            border: 2px solid var(--border);
            border-radius: 999px;
            padding: 11px 18px;
            background: transparent;
            color: var(--text);
            font-weight: 800;
            cursor: pointer;
            font-family: inherit;
        }

        .interview-cancel:hover {
            background: var(--hover);
        }

        .btn {
            display: inline-block;
            padding: 12px 22px;
            border-radius: 999px;
            background: var(--accent);
            color: #fff;
            text-decoration: none;
            font-weight: 900;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 0 var(--accent-dark);
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-size: 0.85rem;
        }

        .btn:hover {
            filter: brightness(1.05);
        }

        .btn:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--accent-dark);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 640px) {
            .topbar {
                padding: 12px 16px;
            }

            .page {
                padding: 28px 16px 60px;
            }

            .course-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 12px;
            }

            .course-card {
                padding: 16px 14px 14px;
                min-height: 150px;
            }

            .course-flag {
                font-size: 2.2rem;
            }

            .interview-actions {
                flex-direction: column;
            }

            .interview-actions button {
                width: 100%;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <!-- ============ TOP BAR ============ -->
    <header class="topbar">
        <a class="brand" href="dashboard.html">
            <span class="brand-mark">μ</span>
            <span>Musalingo</span>
        </a>
        <div class="topbar-actions">
            <a class="top-btn" href="settings.html">Settings</a>
            <a class="top-btn primary" href="dashboard.html">Dashboard</a>
        </div>
    </header>

    <!-- ============ MAIN ============ -->
    <main class="page">
        <h1>I want to learn…</h1>
        <p class="lead">Pick any course below to add it to your dashboard. You can change or remove courses anytime.</p>

        <div class="filter-tabs" id="filterTabs" role="tablist" aria-label="Filter courses by audience"></div>

        <div id="contentArea"></div>
    </main>

    <!-- ============ INTERVIEW MODAL ============ -->
    <div class="interview-backdrop" id="interviewBackdrop" hidden>
        <form class="interview" id="courseInterview">
            <h2 id="interviewTitle">Make this course yours</h2>
            <p id="interviewIntro">A few quick answers will personalize your starting path.</p>
            <div class="interview-fields">
                <label for="experienceAnswer" id="experienceLabel">How much do you already know?</label>
                <select id="experienceAnswer" required></select>
                <label for="reasonAnswer">Why do you want to learn?</label>
                <select id="reasonAnswer" required>
                    <option value="curiosity">Curiosity and fun</option>
                    <option value="school">School or study</option>
                    <option value="work">Work and career</option>
                    <option value="travel">Travel and conversation</option>
                </select>
                <label for="goalAnswer">What would you like to practice most?</label>
                <select id="goalAnswer" required>
                    <option value="confidence">Build confidence</option>
                    <option value="vocabulary">Learn useful vocabulary</option>
                    <option value="speed">Improve speed and recall</option>
                </select>
            </div>
            <div class="interview-actions">
                <button class="interview-cancel" id="interviewCancel" type="button">Not now</button>
                <button class="btn" type="submit">Build my course</button>
            </div>
        </form>
    </div>

    <script src="audience.js"></script>
    <script src="course-curriculum.js"></script>
    <script src="sounds.js"></script>
    <script>
        /* ============================================================
           Musalingo — catalog page (Duolingo-style)
           ============================================================ */

        // ---------- SAFE JSON PARSE ----------
        function safeParse(key, fallback) {
            try {
                const item = localStorage.getItem(key);
                return item ? JSON.parse(item) : fallback;
            } catch (e) {
                console.warn(`Corrupted localStorage for ${key}, resetting.`);
                return fallback;
            }
        }

        // ---------- THEME ----------
        const savedTheme = safeParse('MusalingoSettings', { theme: 'light' });
        document.body.classList.toggle('dark-mode', savedTheme.theme === 'dark');

        // ---------- CURRICULUM (declared ONCE, guarded correctly) ----------
        const curriculum = window.MUSALINGO_CURRICULUM;
        const contentArea = document.getElementById('contentArea');

        if (!curriculum || typeof curriculum.getCourseLessons !== 'function' || !curriculum.courses) {
            contentArea.innerHTML = `
                <div class="empty-state">
                    Course list failed to load.<br>
                    Check your connection and reload the page.<br><br>
                    <a href="javascript:location.reload()">Reload</a>
                </div>`;
            throw new Error('[catalog] MUSALINGO_CURRICULUM not loaded');
        }

        const COURSE_ICONS = Object.fromEntries(
            Object.values(curriculum.courses).map(course => [course.id, course.icon || '📘'])
        );

        const courseCatalog = (Array.isArray(curriculum.catalogGroups) ? curriculum.catalogGroups : [])
            .map(group => ({
                audience: group.audience,
                speakerLanguage: group.audience.replace(/^For\s+/, '').replace(/\s+speakers?$/i, '').trim(),
                courses: (Array.isArray(group.courseIds) ? group.courseIds : [])
                    .map(id => curriculum.courses[id])
                    .filter(Boolean)
            }))
            .filter(group => group.courses.length > 0);

        // ---------- PROFILE ----------
        function createDefaultProfile() {
            return {
                email: '', name: 'Guest learner', streak: 0, diamonds: 100,
                lastActiveDate: null, lastLessonDate: null, streakStatus: 'inactive',
                selectedCourse: null, courses: [], inventory: []
            };
        }

        function loadProfile() {
            const s = localStorage.getItem('MusalingoProfile');
            if (!s) return createDefaultProfile();
            try {
                const p = JSON.parse(s);
                if (!p || typeof p !== 'object') return createDefaultProfile();
                p.courses = Array.isArray(p.courses) ? p.courses : [];
                p.inventory = Array.isArray(p.inventory) ? p.inventory : [];
                p.diamonds = Number(p.diamonds) || 100;
                return p;
            } catch { return createDefaultProfile(); }
        }

        function saveProfile(p) {
            localStorage.setItem('MusalingoProfile', JSON.stringify(p));
        }

        const profile = loadProfile();

        function getCatalogCourse(courseId) {
            const course = curriculum.courses[courseId];
            if (!course) return null;
            return { ...course, lessons: curriculum.getCourseLessons(courseId) };
        }

        function ensureProfileCourse(profile, courseId, speakerLanguage = 'English') {
            const cat = getCatalogCourse(courseId);
            if (!cat) return null;

            const existing = profile.courses.find(c => c.id === courseId);
            if (existing) {
                const saved = Array.isArray(existing.lessons) ? existing.lessons : [];
                existing.lessons = curriculum.getCourseLessons(courseId, saved, existing.learningProfile?.experience);
                existing.speakerLanguage = speakerLanguage;
                return existing;
            }

            const course = {
                id: cat.id,
                name: cat.name,
                icon: COURSE_ICONS[cat.id] || '📘',
                level: cat.level,
                description: cat.description,
                speakerLanguage,
                progress: 0,
                lessons: cat.lessons.map(l => ({ ...l, completed: false }))
            };
            profile.courses.push(course);
            saveProfile(profile);
            return course;
        }

        // ---------- FILTER TABS ----------
        let activeFilter = 'all';
        const filterTabs = document.getElementById('filterTabs');

        function renderFilterTabs() {
            const tabs = [
                { id: 'all', label: 'All courses' },
                ...courseCatalog.map((g, i) => ({ id: String(i), label: g.audience }))
            ];
            filterTabs.innerHTML = tabs.map(t => `
                <button class="filter-tab ${activeFilter === t.id ? 'active' : ''}"
                        type="button" data-filter="${t.id}" role="tab"
                        aria-selected="${activeFilter === t.id}">
                    ${t.label}
                </button>
            `).join('');

            filterTabs.querySelectorAll('.filter-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    activeFilter = btn.dataset.filter;
                    renderFilterTabs();
                    renderCatalog();
                    if (typeof SFX !== 'undefined') SFX.click();
                });
            });
        }

        // ---------- COURSE CARD ----------
        // ── REAL LEARNER COUNT (fetches from Firestore) ──
        const learnerCounts = {}; // Cache to avoid repeated DB calls

            async function fetchRealLearnerCounts() {
                    try {
                        const fb = await import('./firebase.js');
                        // Use the Firestore client from your firebase.js
                        const { getFirestore, collection, getDocs, query, limit } = await import('https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js');
                        const db = getFirestore(fb.app);

                        // Fetch the first 500 user profiles (we only need the 'courses' array)
                        // This prevents reading the whole database and blowing up your quota.
                        const q = query(collection(db, 'users'), limit(500));
                        const snapshot = await getDocs(q);

                        snapshot.forEach(doc => {
                            const data = doc.data();
                            if (Array.isArray(data.courses)) {
                                data.courses.forEach(c => {
                                    if (c && c.id) {
                                        learnerCounts[c.id] = (learnerCounts[c.id] || 0) + 1;
                                    }
                                });
                            }
                        });

                        // Re-render the catalog now that we have real numbers
                        renderCatalog();
                    } catch (err) {
                        console.warn('[catalog] Could not fetch real learner counts:', err);
                        // If Firebase is offline or fails, fall back to showing no count
                        renderCatalog();
                    }
                }   

        function formatLearnerCount(courseId) {
            const count = learnerCounts[courseId] || 0;
            if (count === 0) return 'Be the first learner!';
            if (count === 1) return '1 learner';
            if (count >= 1000000) return (count / 1000000).toFixed(1) + 'M learners';
            if (count >= 1000) return (count / 1000).toFixed(1) + 'K learners';
            return count + ' learners';
        }

        function renderCourseCard(course, speakerLanguage) {
            const icon = COURSE_ICONS[course.id] || '📘';
            const learners = formatLearnerCount(course.id);
            const badge = course.level || '';
            return `
                <button class="course-card" type="button"
                        data-course-id="${course.id}"
                        data-speaker-language="${speakerLanguage}"
                        aria-label="Add ${course.name}">
                    <div class="course-flag" aria-hidden="true">${icon}</div>
                    <div class="course-name">${course.name}</div>
                    <div class="course-learners">${learners}</div>
                    ${badge ? `<span class="course-badge">${badge}</span>` : ''}
                </button>
            `;
        }

        // ---------- RENDER CATALOG ----------
        function renderCatalog() {
            const groups = activeFilter === 'all'
                ? courseCatalog
                : [courseCatalog[Number(activeFilter)]].filter(Boolean);

            if (!groups.length) {
                contentArea.innerHTML = `<div class="empty-state">No courses available right now.</div>`;
                return;
            }

            contentArea.innerHTML = groups.map(group => `
                <div class="section-label">${group.audience}</div>
                <div class="course-grid">
                    ${group.courses.map(c => renderCourseCard(c, group.speakerLanguage)).join('')}
                </div>
            `).join('');

            contentArea.querySelectorAll('.course-card').forEach(card => {
                card.addEventListener('click', () => {
                    if (typeof SFX !== 'undefined') SFX.click();
                    openCourseInterview(card.dataset.courseId, card.dataset.speakerLanguage);
                });
            });
        }

        // ---------- INTERVIEW ----------
        const interviewBackdrop = document.getElementById('interviewBackdrop');
        const courseInterview = document.getElementById('courseInterview');
        const interviewTitle = document.getElementById('interviewTitle');
        const interviewIntro = document.getElementById('interviewIntro');
        const experienceLabel = document.getElementById('experienceLabel');
        const experienceAnswer = document.getElementById('experienceAnswer');
        let pendingCourseId = null;
        let pendingSpeakerLanguage = 'English';

        function openCourseInterview(id, speakerLanguage = 'English') {
            const course = getCatalogCourse(id);
            if (!course) return;
            pendingCourseId = id;
            pendingSpeakerLanguage = speakerLanguage || 'English';

            const isMath = course.id === 'math';
            const isChess = course.id === 'chess';

            interviewTitle.textContent = `Set up your ${course.name} path`;
            interviewIntro.textContent = isMath
                ? 'Choose the kind of Math practice that fits you best.'
                : isChess
                    ? 'Tell us your chess level so we can choose the right starting point.'
                    : 'A few quick answers will personalize your starting path.';

            experienceLabel.textContent = isMath
                ? 'What kind of Math do you want to learn?'
                : isChess
                    ? 'What is your Elo rating?'
                    : 'How much do you already know?';

            experienceAnswer.innerHTML = isMath
                ? `<option value="grade-1">Grade 1 Math</option>${Array.from({ length: 9 }, (_, i) => `<option value="grade-${i + 2}">Grade ${i + 2} Math</option>`).join('')}<option value="fun-math">Fun Math</option><option value="adult-math">Adult Math</option>`
                : isChess
                    ? '<option value="unrated">I do not have an Elo rating yet</option><option value="under-800">Under 800</option><option value="800-1000">800-1000</option><option value="1000-1200">1000-1200</option><option value="1200-1400">1200-1400</option><option value="1400-plus">1400+</option>'
                    : '<option value="new">I am completely new</option><option value="some">I know a few basics</option><option value="comfortable">I can hold simple conversations</option><option value="advanced">I want a challenge</option>';

            interviewBackdrop.hidden = false;
            experienceAnswer.focus();
        }

        function closeCourseInterview() {
            pendingCourseId = null;
            pendingSpeakerLanguage = 'English';
            interviewBackdrop.hidden = true;
            courseInterview.reset();
        }

        // ---------- BOOT ----------
        renderFilterTabs();
        renderCatalog(); // Render immediately with "Be the first learner!"
        fetchRealLearnerCounts(); // Fetch real numbers in the background and re-render

        document.getElementById('interviewCancel').addEventListener('click', closeCourseInterview);

        courseInterview.addEventListener('submit', (event) => {
            event.preventDefault();
            if (!pendingCourseId) return;

            const course = ensureProfileCourse(profile, pendingCourseId, pendingSpeakerLanguage);
            if (!course) { closeCourseInterview(); return; }

            const previousExperience = course.learningProfile?.experience || 'grade-1';
            const savedLessons = Array.isArray(course.lessons) ? course.lessons : [];

            course.learningProfile = {
                experience: experienceAnswer.value,
                eloRating: pendingCourseId === 'chess' ? experienceAnswer.value : null,
                reason: document.getElementById('reasonAnswer').value,
                goal: document.getElementById('goalAnswer').value
            };
            if (pendingCourseId === 'math') {
                const gradeChanged = previousExperience !== course.learningProfile.experience;
                course.lessons = curriculum.getCourseLessons(
                    course.id,
                    gradeChanged ? [] : savedLessons,
                    course.learningProfile.experience
                );
                if (gradeChanged) course.progress = 0;
            }

            saveProfile(profile);

            if (typeof SFX !== 'undefined') SFX.correct();

            window.location.href = `dashboard.html?courseId=${encodeURIComponent(pendingCourseId)}`;
        });
