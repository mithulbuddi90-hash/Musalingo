<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quests - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="quest.css">
</head>

<body>
    <main class="quest-page">
        <section class="quest-shell">
            <header class="quest-hero">
                <div class="quest-hero-text">
                    <span class="quest-eyebrow">Daily Quests</span>
                    <h1>Today's challenges</h1>
                    <p id="questSubtitle">Complete lessons to finish your quests.</p>
                </div>

                <div class="quest-character" aria-hidden="true">
                    <div class="quest-speech" id="questSpeech">Let's crush today's quests!</div>
                    <img class="quest-character-img" src="characters/quest-coach.png" alt=""
                        onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'quest-character-fallback',textContent:'🦉'}))">
                </div>
            </header>

            <div class="quest-progress-row">
                <div class="quest-ring" id="questRing" style="--pct:0">
                    <svg viewBox="0 0 120 120" aria-hidden="true">
                        <circle class="ring-track" cx="60" cy="60" r="52"></circle>
                        <circle class="ring-fill" cx="60" cy="60" r="52"></circle>
                    </svg>
                    <div class="quest-ring-label">
                        <strong id="questRingCount">0/3</strong>
                        <span>done</span>
                    </div>
                </div>
                <div class="quest-progress-copy">
                    <h2 id="questProgressTitle">Keep going!</h2>
                    <p id="questProgressText">Finish all three quests to unlock the Mega Chest.</p>
                    <div class="quest-progress-bar">
                        <div class="quest-progress-fill" id="questProgressFill"></div>
                    </div>
                </div>
            </div>

            <div class="quest-list" id="questList" aria-live="polite"></div>

            <section class="reward-panel" id="rewardPanel" hidden aria-live="polite">
                <h2>Today's rewards</h2>
                <div class="reward-list" id="rewardList"></div>
            </section>

            <p class="note" id="questNote">
                Quest ticks are added automatically when the related learning activity is completed.
            </p>

            <a class="btn-back" href="dashboard.html">← Back to dashboard</a>
        </section>
    </main>

    <script src="sounds.js"></script>
    <script src="quest.js"></script>
    <script src="quest-page.js"></script>
    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
