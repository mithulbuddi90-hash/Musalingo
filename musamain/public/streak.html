<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Streak Society - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="streak.css">
</head>

<body>
    <main class="streak-page">
        <section class="streak-shell">
            <header class="streak-hero">
                <div class="streak-hero-text">
                    <span class="streak-eyebrow">Streak Society</span>
                    <h1>Your streak</h1>
                    <p id="streakInfo">Loading streak…</p>
                </div>
                <div class="streak-character" aria-hidden="true">
                    <div class="streak-speech" id="streakSpeech">Keep the flame alive!</div>
                    <img class="streak-character-img" src="characters/streak-owl.png" alt=""
                        onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'streak-character-fallback',textContent:'🦉'}))">
                </div>
            </header>

            <div class="streak-stats">
                <div class="side-card streak-stat-card">
                    <span class="streak-stat-icon">🔥</span>
                    <div>
                        <strong id="currentStreak">0 days</strong>
                        <span>Current streak</span>
                    </div>
                </div>
                <div class="side-card streak-stat-card">
                    <span class="streak-stat-icon">❄️</span>
                    <div>
                        <strong id="freezeCountDisplay">0</strong>
                        <span>Streak freezes</span>
                    </div>
                </div>
            </div>

            <div class="side-card streak-pause-card">
                <label class="pause-label">
                    <input type="checkbox" id="pauseToggle" />
                    <span>Pause streak</span>
                </label>
                <p class="pause-hint">Pausing stops the streak from resetting while you're away.</p>
            </div>

            <div class="side-card streak-calendar-card">
                <div class="calendar-header">
                    <button class="calendar-nav" id="previousMonth" type="button"
                        aria-label="Previous month">&lsaquo;</button>
                    <h3 id="calendarTitle">Loading calendar...</h3>
                    <button class="calendar-nav" id="nextMonth" type="button" aria-label="Next month">&rsaquo;</button>
                </div>
                <div class="weekday-row" aria-hidden="true">
                    <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
                </div>
                <div class="calendar-grid" id="calendarGrid" aria-label="Streak calendar"></div>
                <div class="calendar-legend">
                    <span class="legend-item"><span class="legend-dot completed"></span>Completed</span>
                    <span class="legend-item"><span class="legend-dot missed"></span>Missed</span>
                    <span class="legend-item"><span class="legend-dot frozen"></span>Freeze used</span>
                </div>
            </div>

            <div class="side-card streak-friends-card">
                <h3>Friend streaks</h3>
                <div id="friendStreaks"></div>
            </div>

            <a class="btn-back" href="dashboard.html">← Back to dashboard</a>
        </section>
    </main>

    <script src="sounds.js"></script>
    <script src="streak-page.js"></script>
    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
