<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Shop - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">

    <style>
        :root {
            --bg: #f7f8fc;
            --panel: #ffffff;
            --panel-2: #f3f6fb;
            --text: #1f2937;
            --text-strong: #111827;
            --muted: #6b7280;
            --accent: #EC96C7;
            --accent-dark: #F490C3;
            --border: #e5e7eb;
            --blue: #1cb0f6;
            --blue-dark: #1587bd;
            --green: #58cc02;
            --green-dark: #46a302;
            --gold: #ffc800;
            --gold-dark: #e5b200;
            --red: #ff4b4b;
            --red-dark: #d63030;
            --purple: #a560e8;
            --orange: #ff9600;
        }

        body.dark-mode {
            --bg: #131f24;
            --panel: #1c2a30;
            --panel-2: #2b3a42;
            --text: #f1f7fb;
            --text-strong: #ffffff;
            --muted: #8a9aa6;
            --border: #2f3e46;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        button {
            font: inherit;
            cursor: pointer;
        }

        a {
            text-decoration: none;
            color: inherit;
        }

        /* ===== 3D PRESS ===== */
        .btn,
        .btn-mini,
        .item-card,
        .chip {
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
        }

        .btn:active,
        .btn-mini:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 currentColor;
        }

        .item-card:active {
            transform: translateY(2px) scale(0.99);
        }

        .chip:active {
            transform: scale(0.97);
        }

        /* ===== PAGE ===== */
        .page {
            max-width: 1080px;
            margin: 0 auto;
            padding: 24px 24px 60px;
        }

        /* ===== TOP BAR ===== */
        .topbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 0;
            margin-bottom: 20px;
            border-bottom: 2px solid var(--border);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--accent);
            letter-spacing: -0.03em;
        }

        .brand-mark {
            width: 34px;
            height: 34px;
            border-radius: 10px;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            color: #fff;
            display: grid;
            place-items: center;
            font-size: 1.1rem;
            font-weight: 900;
        }

        .topbar-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .balance-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 999px;
            background: linear-gradient(135deg, #e0f2fe, #bae6fd);
            color: #0369a1;
            font-weight: 800;
            font-size: 0.95rem;
            border: 2px solid #7dd3fc;
        }

        body.dark-mode .balance-pill {
            background: linear-gradient(135deg, #0c4a6e, #075985);
            color: #bae6fd;
            border-color: #0ea5e9;
        }

        .balance-pill .icon {
            font-size: 1.1rem;
        }

        .back-btn {
            padding: 8px 14px;
            border-radius: 12px;
            background: var(--panel);
            border: 2px solid var(--border);
            color: var(--text);
            font-weight: 800;
            font-size: 0.82rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .back-btn:hover {
            background: var(--panel-2);
            border-color: var(--accent);
        }

        /* ===== HEADER ===== */
        .shop-header {
            display: flex;
            align-items: center;
            gap: 18px;
            margin-bottom: 24px;
        }

        .shop-header-icon {
            width: 64px;
            height: 64px;
            border-radius: 18px;
            background: linear-gradient(135deg, var(--gold), #ff8c00);
            display: grid;
            place-items: center;
            font-size: 2rem;
            color: #fff;
            box-shadow: 0 6px 0 var(--gold-dark);
            flex-shrink: 0;
        }

        .shop-header-text h1 {
            margin: 0 0 4px;
            font-size: clamp(1.4rem, 3vw, 1.9rem);
            color: var(--text-strong);
            font-weight: 900;
        }

        .shop-header-text p {
            margin: 0;
            color: var(--muted);
            font-weight: 600;
        }

        /* ===== CATEGORY TABS ===== */
        .category-tabs {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 20px;
            padding-bottom: 4px;
        }

        .chip {
            padding: 8px 16px;
            border-radius: 999px;
            border: 2px solid var(--border);
            background: var(--panel);
            color: var(--text);
            font-weight: 800;
            font-size: 0.82rem;
            cursor: pointer;
            font-family: inherit;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .chip:hover {
            border-color: var(--accent);
        }

        .chip.active {
            background: color-mix(in srgb, var(--accent) 15%, var(--panel));
            border-color: var(--accent);
            color: var(--accent-dark);
        }

        /* ===== ITEM GRID ===== */
        .item-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }

        .item-card {
            position: relative;
            padding: 20px;
            border-radius: 18px;
            border: 2px solid var(--border);
            background: var(--panel);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            text-align: left;
            overflow: hidden;
            min-height: 200px;
        }

        .item-card:hover {
            transform: translateY(-3px);
            border-color: var(--item-color, var(--accent));
            box-shadow: 0 8px 0 color-mix(in srgb, var(--item-color, var(--accent)) 30%, transparent);
        }

        .item-icon {
            width: 56px;
            height: 56px;
            border-radius: 16px;
            display: grid;
            place-items: center;
            font-size: 2rem;
            margin-bottom: 14px;
            background: color-mix(in srgb, var(--item-color, var(--accent)) 15%, var(--panel));
        }

        .item-badge {
            position: absolute;
            top: 14px;
            right: 14px;
            padding: 4px 10px;
            border-radius: 8px;
            background: var(--item-color, var(--accent));
            color: #fff;
            font-size: 0.68rem;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .item-name {
            font-size: 1.05rem;
            font-weight: 900;
            color: var(--text-strong);
            margin: 0 0 6px;
        }

        .item-desc {
            font-size: 0.85rem;
            color: var(--muted);
            line-height: 1.45;
            margin: 0 0 auto;
            padding-bottom: 14px;
        }

        .item-footer {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }

        .item-price {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            font-weight: 900;
            font-size: 0.95rem;
            color: var(--blue);
        }

        .item-price .icon {
            font-size: 1rem;
        }

        .btn-mini {
            padding: 9px 14px;
            border-radius: 10px;
            border: none;
            background: var(--green);
            color: #fff;
            font-weight: 900;
            font-size: 0.78rem;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            box-shadow: 0 3px 0 var(--green-dark);
        }

        .btn-mini:hover {
            filter: brightness(1.05);
        }

        .btn-mini:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            box-shadow: none;
            background: var(--muted);
        }

        .btn-mini.owned {
            background: var(--panel-2);
            color: var(--muted);
            box-shadow: 0 3px 0 var(--border);
        }

        /* ===== NOTICE ===== */
        .notice {
            padding: 14px 18px;
            border-radius: 14px;
            background: linear-gradient(135deg, #fef3c7, #fde68a);
            border: 2px solid #fbbf24;
            color: #78350f;
            font-weight: 700;
            font-size: 0.9rem;
            margin-bottom: 20px;
        }

        body.dark-mode .notice {
            background: linear-gradient(135deg, #3d2f00, #4a3700);
            border-color: #b45309;
            color: #fbbf24;
        }

        .notice[hidden] {
            display: none;
        }

        /* ===== INVENTORY ===== */
        .inventory-section {
            padding: 20px;
            border-radius: 18px;
            background: var(--panel);
            border: 2px solid var(--border);
            margin-bottom: 20px;
        }

        .inventory-title {
            margin: 0 0 12px;
            font-size: 1rem;
            color: var(--text-strong);
            font-weight: 900;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .inventory-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .inventory-chip {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            border-radius: 999px;
            background: var(--panel-2);
            border: 1px solid var(--border);
            font-size: 0.82rem;
            font-weight: 700;
            color: var(--text);
        }

        .inventory-empty {
            color: var(--muted);
            font-size: 0.85rem;
            font-weight: 600;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            right: 22px;
            bottom: 22px;
            z-index: 50;
            max-width: min(380px, calc(100vw - 44px));
            padding: 13px 16px;
            border-radius: 13px;
            background: var(--text);
            color: var(--bg);
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.25);
            font-size: 0.88rem;
            font-weight: 700;
            opacity: 0;
            pointer-events: none;
            transform: translateY(10px);
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        .toast.error {
            background: var(--red);
            color: #fff;
        }

        .toast.success {
            background: var(--green);
            color: #fff;
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 640px) {
            .page {
                padding: 14px 14px 40px;
            }

            .topbar {
                padding: 12px 0;
                flex-wrap: wrap;
            }

            .brand {
                font-size: 1.2rem;
            }

            .topbar-right {
                width: 100%;
                justify-content: space-between;
            }

            .shop-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }

            .shop-header-icon {
                width: 52px;
                height: 52px;
                font-size: 1.7rem;
            }

            .item-grid {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .item-card {
                padding: 14px;
                min-height: 180px;
            }

            .item-icon {
                width: 44px;
                height: 44px;
                font-size: 1.6rem;
                margin-bottom: 10px;
            }

            .item-name {
                font-size: 0.92rem;
            }

            .item-desc {
                font-size: 0.75rem;
            }

            .btn-mini {
                padding: 7px 10px;
                font-size: 0.7rem;
            }
        }

        @media (max-width: 380px) {
            .item-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page">

        <!-- ===== TOP BAR ===== -->
        <header class="topbar">
            <a class="brand" href="dashboard.html">
                <span class="brand-mark">μ</span>
                <span>Musalingo Shop</span>
            </a>
            <div class="topbar-right">
                <div class="balance-pill">
                    <span class="icon">💎</span>
                    <span id="diamondBalance">0</span>
                </div>
                <a class="back-btn" href="dashboard.html">← Dashboard</a>
            </div>
        </header>

        <!-- ===== SHOP HEADER ===== -->
        <div class="shop-header">
            <div class="shop-header-icon" aria-hidden="true">🛍️</div>
            <div class="shop-header-text">
                <h1>Spend your diamonds</h1>
                <p>Buy hearts, boosts, and cosmetics with the diamonds you earn.</p>
            </div>
        </div>

        <!-- ===== NOTICE ===== -->
        <div class="notice" id="shopNotice" hidden></div>

        <!-- ===== CATEGORY TABS ===== -->
        <div class="category-tabs" id="categoryTabs" role="tablist"></div>

        <!-- ===== ITEM GRID ===== -->
        <div class="item-grid" id="shopGrid"></div>

        <!-- ===== INVENTORY ===== -->
        <section class="inventory-section">
            <h2 class="inventory-title">🎁 Your inventory</h2>
            <div class="inventory-grid" id="inventoryGrid"></div>
        </section>

    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="sounds.js"></script>

    <script>
        /* ============================================================
           Musalingo — shop page
           ============================================================ */

        // ── SAFE PARSE (fixes crash on corrupted localStorage) ──
        function safeParse(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' ? parsed : fallback;
            } catch (err) {
                console.warn(`[shop] Corrupted localStorage for ${key}; using defaults.`, err);
                return fallback;
            }
        }

        // ── SFX GUARDS (fixes crash if sounds.js failed) ──
        function playSfx(name, arg) {
            try {
                if (window.SFX && typeof window.SFX[name] === 'function') {
                    if (arg !== undefined) window.SFX[name](arg);
                    else window.SFX[name]();
                }
            } catch (err) {
                console.warn(`[shop] SFX.${name} failed:`, err);
            }
        }

        /* ============================================================
           SHOP ITEMS
           ============================================================ */
        const SHOP_ITEMS = [
            {
                id: 'heart-1',
                name: '1 Heart',
                description: 'Restore one heart so you can keep studying without waiting.',
                cost: 10,
                badge: 'Quick refill',
                icon: '❤️',
                color: '#ff4b4b',
                category: 'hearts',
                consumable: true
            },
            {
                id: 'heart-full',
                name: 'Full Heart Refill',
                description: 'Top up your hearts back to 5 immediately.',
                cost: 50,
                badge: 'Best value',
                icon: '💖',
                color: '#ff4b4b',
                category: 'hearts',
                consumable: true
            },
            {
                id: 'daily-booster',
                name: 'Daily Booster',
                description: 'Unlock a bonus lesson pack and earn a fresh study boost.',
                cost: 50,
                badge: 'Popular',
                icon: '🚀',
                color: '#a560e8',
                category: 'boosts',
                consumable: false
            },
            {
                id: 'streak-shield',
                name: 'Streak Freeze',
                description: 'Protect your streak from a missed day. Max 3 in inventory.',
                cost: 60,
                badge: 'Protective',
                icon: '❄️',
                color: '#1cb0f6',
                category: 'boosts',
                consumable: false
            },
            {
                id: 'lucky-chest',
                name: 'Lucky Chest',
                description: 'Open a mystery reward chest packed with extra gems and fun.',
                cost: 70,
                badge: 'Mystery',
                icon: '🎁',
                color: '#ff9600',
                category: 'boosts',
                consumable: false
            },
            {
                id: 'theme-pack',
                name: 'Theme Pack',
                description: 'Refresh your app look with a bright neon theme.',
                cost: 80,
                badge: 'New look',
                icon: '🎨',
                color: '#ec96c7',
                category: 'cosmetics',
                consumable: false
            },
            {
                id: 'voice-coach',
                name: 'Voice Coach',
                description: 'Unlock pronunciation practice with extra speaking guidance.',
                cost: 90,
                badge: 'Speaking',
                icon: '🎙️',
                color: '#ff4b4b',
                category: 'boosts',
                consumable: false
            },
            {
                id: 'gold-badge',
                name: 'Gold Badge',
                description: 'Show off a collectible badge on your profile for completed goals.',
                cost: 120,
                badge: 'Premium',
                icon: '🏆',
                color: '#ffc800',
                category: 'cosmetics',
                consumable: false
            }
        ];

        const CATEGORIES = [
            { id: 'all', label: 'All', icon: '✨' },
            { id: 'hearts', label: 'Hearts', icon: '❤️' },
            { id: 'boosts', label: 'Boosts', icon: '⚡' },
            { id: 'cosmetics', label: 'Cosmetics', icon: '🎨' }
        ];

        /* ============================================================
           PROFILE
           ============================================================ */
        function loadProfile() {
            const raw = safeParse('MusalingoProfile', null);
            if (!raw) return defaultProfile();
            const diamonds = Number(raw.diamonds);
            const streak = Number(raw.streak);
            const freezes = Number(raw.streakFreezes);
            const hearts = Number(raw.hearts);
            return {
                ...defaultProfile(),
                ...raw,
                inventory: Array.isArray(raw.inventory) ? raw.inventory : [],
                diamonds: Number.isFinite(diamonds) ? Math.max(0, Math.floor(diamonds)) : 100,
                streak: Number.isFinite(streak) ? Math.max(0, Math.floor(streak)) : 0,
                streakFreezes: Number.isFinite(freezes) ? Math.min(3, Math.max(0, Math.floor(freezes))) : 0,
                streakFreezeDates: Array.isArray(raw.streakFreezeDates)
                    ? raw.streakFreezeDates.filter(d => typeof d === 'string')
                    : [],
                hearts: Number.isFinite(hearts) ? Math.max(0, Math.min(5, Math.floor(hearts))) : 5
            };
        }

        function defaultProfile() {
            return {
                diamonds: 100,
                hearts: 5,
                streak: 0,
                streakFreezes: 0,
                streakFreezeDates: [],
                inventory: []
            };
        }

        function saveProfile(p) {
            try {
                localStorage.setItem('MusalingoProfile', JSON.stringify(p));
            } catch (err) {
                console.warn('[shop] Could not save profile:', err);
            }
        }

        let profile = loadProfile();
        let activeCategory = 'all';

        /* ============================================================
           RENDER
           ============================================================ */

        function renderCategoryTabs() {
            const tabs = document.getElementById('categoryTabs');
            tabs.innerHTML = CATEGORIES.map(cat => `
                <button class="chip ${activeCategory === cat.id ? 'active' : ''}"
                        type="button"
                        data-category="${cat.id}"
                        role="tab"
                        aria-selected="${activeCategory === cat.id}">
                    ${cat.icon} ${cat.label}
                </button>
            `).join('');

            tabs.querySelectorAll('.chip').forEach(chip => {
                chip.addEventListener('click', () => {
                    activeCategory = chip.dataset.category;
                    renderCategoryTabs();
                    renderGrid();
                    playSfx('click');
                });
            });
        }

        function getItemEffectiveCost(item) {
            // FIX: heart-full dynamic cost
            if (item.id === 'heart-full') {
                const missing = Math.max(0, 5 - profile.hearts);
                return missing === 0 ? item.cost : missing * 10;
            }
            return item.cost;
        }

        function renderGrid() {
            const grid = document.getElementById('shopGrid');
            const items = activeCategory === 'all'
                ? SHOP_ITEMS
                : SHOP_ITEMS.filter(i => i.category === activeCategory);

            if (!items.length) {
                grid.innerHTML = '<div style="grid-column:1/-1;text-align:center;padding:40px;color:var(--muted);font-weight:700;">No items in this category yet.</div>';
                return;
            }

            grid.innerHTML = items.map(item => {
                const cost = getItemEffectiveCost(item);
                const owned = !item.consumable && profile.inventory.includes(item.id);
                const freezeLimitReached = item.id === 'streak-shield' && profile.streakFreezes >= 3;
                const heartsFull = item.id === 'heart-full' && profile.hearts >= 5;
                const canAfford = profile.diamonds >= cost;

                // FIX: proper button labels per state
                let buttonLabel;
                let disabled;
                if (owned) {
                    buttonLabel = 'Owned';
                    disabled = true;
                } else if (freezeLimitReached) {
                    buttonLabel = 'Max reached';
                    disabled = true;
                } else if (heartsFull) {
                    buttonLabel = 'Hearts full';
                    disabled = true;
                } else if (!canAfford) {
                    buttonLabel = 'Need more 💎';
                    disabled = true;
                } else {
                    buttonLabel = 'Buy now';
                    disabled = false;
                }

                const buttonClass = owned ? 'btn-mini owned' : 'btn-mini';

                return `
                    <div class="item-card" style="--item-color:${item.color};" data-item-id="${item.id}">
                        <span class="item-badge" style="background:${item.color};">${item.badge}</span>
                        <div class="item-icon" style="background:color-mix(in srgb, ${item.color} 15%, var(--panel));">${item.icon}</div>
                        <h3 class="item-name">${item.name}</h3>
                        <p class="item-desc">${item.description}</p>
                        <div class="item-footer">
                            <span class="item-price"><span class="icon">💎</span>${cost}</span>
                            <button class="${buttonClass}" type="button" data-buy="${item.id}" ${disabled ? 'disabled' : ''}>
                                ${buttonLabel}
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Bind buy buttons
            grid.querySelectorAll('[data-buy]').forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.disabled) return;
                    buyItem(btn.dataset.buy);
                });
            });
        }

        function renderInventory() {
            const container = document.getElementById('inventoryGrid');

            // Build a display list from inventory + streakFreezes
            const items = [];

            // Counted inventory items
            const counts = {};
            (profile.inventory || []).forEach(id => {
                counts[id] = (counts[id] || 0) + 1;
            });

            for (const [id, count] of Object.entries(counts)) {
                const def = SHOP_ITEMS.find(i => i.id === id);
                const name = def ? def.name : id.replace(/-/g, ' ');
                const icon = def ? def.icon : '📦';
                items.push({
                    icon,
                    label: `${name}${count > 1 ? ` ×${count}` : ''}`
                });
            }

            // Streak freezes
            const freezes = Math.min(3, Math.max(0, Number(profile.streakFreezes) || 0));
            if (freezes > 0) {
                items.push({ icon: '❄️', label: `Streak Freeze ×${freezes}` });
            }

            // Hearts (always show)
            items.unshift({ icon: '❤️', label: `Hearts ×${profile.hearts}` });
            // Diamonds
            items.unshift({ icon: '💎', label: `Diamonds ×${profile.diamonds}` });

            if (items.length === 0) {
                container.innerHTML = '<span class="inventory-empty">Your inventory is empty. Buy something above!</span>';
                return;
            }

            container.innerHTML = items.map(i => `
                <span class="inventory-chip"><span>${i.icon}</span><span>${i.label}</span></span>
            `).join('');
        }

        function updateBalance() {
            document.getElementById('diamondBalance').textContent = profile.diamonds;
        }

        /* ============================================================
           PURCHASE
           ============================================================ */

        function buyItem(itemId) {
            // FIX: safeParse instead of raw JSON.parse
            const settings = safeParse('MusalingoSettings', {});
            if (settings.noGamification) {
                showToast('Purchases are disabled in settings.', 'error');
                return;
            }

            const item = SHOP_ITEMS.find(i => i.id === itemId);
            if (!item) return;

            // Reload profile to avoid stale state
            profile = loadProfile();

            // Guard: already owned
            if (!item.consumable && profile.inventory.includes(item.id) && item.id !== 'streak-shield') {
                showToast(`${item.name} is already in your collection.`, 'error');
                playSfx('error');
                return;
            }

            // Guard: streak freeze max
            if (item.id === 'streak-shield' && profile.streakFreezes >= 3) {
                showToast('You can only hold up to 3 Streak Freezes at once.', 'error');
                playSfx('error');
                return;
            }

            // Guard: full hearts (FIX: this was the silent-fail bug)
            const cost = getItemEffectiveCost(item);
            if (item.id === 'heart-full' && profile.hearts >= 5) {
                showToast('Your hearts are already full.', 'error');
                playSfx('error');
                return;
            }

            // Guard: can't afford
            if (profile.diamonds < cost) {
                const short = cost - profile.diamonds;
                showToast(`You need ${short} more 💎 to buy ${item.name}.`, 'error');
                playSfx('error');
                return;
            }

            // Charge
            profile.diamonds -= cost;

            // Apply effect
            if (item.consumable) {
                const applied = applyConsumable(item);
                if (!applied) {
                    profile.diamonds += cost;  // refund
                    showToast('Could not apply this item right now.', 'error');
                    playSfx('error');
                    return;
                }
            } else if (item.id === 'streak-shield') {
                profile.streakFreezes = Math.min(3, (profile.streakFreezes || 0) + 1);
            } else {
                profile.inventory.push(item.id);
            }

            saveProfile(profile);
            updateBalance();
            renderGrid();
            renderInventory();
            showToast(`Purchased ${item.name}!`, 'success');

            // FX
            if (item.id === 'heart-1' || item.id === 'heart-full') {
                playSfx('gemEarned');
            } else {
                playSfx('correct');
            }
        }

        function applyConsumable(item) {
            const maxHearts = 5;
            const current = Math.max(0, Math.min(maxHearts, Number(profile.hearts) || maxHearts));

            if (item.id === 'heart-1') {
                if (current >= maxHearts) return false;
                profile.hearts = Math.min(maxHearts, current + 1);
                delete profile.heartRefillAt;
                return true;
            }

            if (item.id === 'heart-full') {
                if (current >= maxHearts) return false;
                profile.hearts = maxHearts;
                delete profile.heartRefillAt;
                return true;
            }

            return false;
        }

        /* ============================================================
           TOAST
           ============================================================ */
        let toastTimer;
        function showToast(message, type = '') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (type ? ` ${type}` : '');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                toast.classList.remove('show');
            }, 2800);
        }

        /* ============================================================
           STORAGE SYNC
           ============================================================ */
        window.addEventListener('storage', (event) => {
            if (event.key === 'MusalingoProfile') {
                profile = loadProfile();
                updateBalance();
                renderGrid();
                renderInventory();
            }
        });

        /* ============================================================
           BOOT
           ============================================================ */
        function boot() {
            updateBalance();
            renderCategoryTabs();
            renderGrid();
            renderInventory();
        }

        boot();
    </script>
    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
