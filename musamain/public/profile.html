<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">

    <style>
        :root {
            --bg: #f7f8fc;
            --card: #ffffff;
            --text: #1f2937;
            --text-strong: #111827;
            --muted: #6b7280;
            --accent: #EC96C7;
            --accent-dark: #F490C3;
            --accent-soft: #fdf2f8;
            --border: #e5e7eb;
            --blue: #1cb0f6;
            --blue-dark: #1587bd;
            --green: #58cc02;
            --green-dark: #46a302;
            --gold: #ffc800;
            --gold-dark: #e5b200;
            --danger: #dc2626;
            --danger-dark: #991b1b;
        }

        body.dark-mode {
            --bg: #131f24;
            --card: #1c2a30;
            --text: #e5e7eb;
            --text-strong: #f1f7fb;
            --muted: #8a9aa6;
            --border: #2f3e46;
            --accent-soft: #4b2941;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        .page {
            width: min(900px, 100%);
            margin: 0 auto;
        }

        /* ---------- HEADER / AVATAR BLOCK ---------- */
        .profile-header {
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 28px;
            border-radius: 24px;
            background: var(--card);
            border: 2px solid var(--border);
            margin-bottom: 18px;
            position: relative;
            overflow: hidden;
        }

        .profile-header::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg,
                    color-mix(in srgb, var(--accent) 12%, transparent),
                    transparent 60%);
            pointer-events: none;
        }

        .avatar {
            width: 110px;
            height: 110px;
            flex-shrink: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 3rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
            box-shadow: 0 8px 0 color-mix(in srgb, var(--accent) 40%, transparent);
            position: relative;
            z-index: 1;
        }

        .identity {
            flex: 1;
            min-width: 0;
            position: relative;
            z-index: 1;
        }

        .identity h1 {
            margin: 0 0 4px;
            font-size: clamp(1.4rem, 3vw, 2rem);
            color: var(--text-strong);
            font-weight: 900;
            letter-spacing: -0.02em;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .identity p {
            margin: 0;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.95rem;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .header-actions {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            position: relative;
            z-index: 1;
        }

        /* ---------- BUTTONS ---------- */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 11px 18px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.85rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            border: none;
            cursor: pointer;
            font-family: inherit;
            transition: transform 0.08s ease, box-shadow 0.08s ease, filter 0.15s ease;
            box-shadow: 0 4px 0 var(--btn-shadow, var(--accent-dark));
            background: var(--accent);
            color: #fff;
        }

        .btn:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--btn-shadow, var(--accent-dark));
        }

        .btn:hover {
            filter: brightness(1.05);
        }

        .btn.secondary {
            background: var(--blue);
            --btn-shadow: var(--blue-dark);
        }

        .btn.success {
            background: var(--green);
            --btn-shadow: var(--green-dark);
        }

        .btn.danger {
            background: var(--danger);
            --btn-shadow: var(--danger-dark);
        }

        [data-account-sign-in][hidden],
        [data-account-sign-out][hidden] {
            display: none !important;
        }

        /* ---------- STATS ROW ---------- */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(4, minmax(0, 1fr));
            gap: 12px;
            margin-bottom: 18px;
        }

        .stat {
            padding: 18px 14px;
            border-radius: 18px;
            background: var(--card);
            border: 2px solid var(--border);
            text-align: center;
            position: relative;
        }

        .stat-icon {
            font-size: 1.6rem;
            margin-bottom: 4px;
            line-height: 1;
        }

        .stat-value {
            font-size: 1.6rem;
            font-weight: 900;
            color: var(--text-strong);
            line-height: 1.1;
            font-variant-numeric: tabular-nums;
        }

        .stat-label {
            font-size: 0.72rem;
            font-weight: 800;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-top: 4px;
        }

        /* ---------- SECTION CARDS ---------- */
        .section-card {
            padding: 22px;
            border-radius: 20px;
            background: var(--card);
            border: 2px solid var(--border);
            margin-bottom: 18px;
        }

        .section-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 16px;
        }

        .section-head h2 {
            margin: 0;
            font-size: 1.15rem;
            color: var(--text-strong);
            font-weight: 900;
        }

        .section-head .link {
            font-size: 0.82rem;
            font-weight: 800;
            color: var(--blue);
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .section-head .link:hover {
            text-decoration: underline;
        }

        /* ---------- COURSE ROWS ---------- */
        .course-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 14px 0;
            border-bottom: 1px solid var(--border);
        }

        .course-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .course-icon {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 14px;
            display: grid;
            place-items: center;
            font-size: 1.5rem;
            background: var(--accent-soft);
        }

        .course-info {
            flex: 1;
            min-width: 0;
        }

        .course-info h3 {
            margin: 0 0 6px;
            font-size: 1rem;
            font-weight: 800;
            color: var(--text-strong);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .progress-track {
            height: 10px;
            border-radius: 999px;
            background: color-mix(in srgb, var(--border) 70%, transparent);
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--accent), var(--accent-dark));
            transition: width 0.35s ease;
        }

        .course-percent {
            font-size: 0.85rem;
            font-weight: 900;
            color: var(--accent-dark);
            margin-left: 12px;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }

        /* ---------- EMPTY STATE ---------- */
        .empty-state {
            padding: 28px 20px;
            border-radius: 16px;
            background: var(--accent-soft);
            border: 2px dashed color-mix(in srgb, var(--accent) 45%, var(--border));
            text-align: center;
            color: var(--text);
            font-weight: 700;
            font-size: 0.9rem;
        }

        .empty-state a {
            color: var(--accent-dark);
            font-weight: 900;
            text-decoration: underline;
        }

        /* ---------- FRIEND ROWS ---------- */
        .friend-row {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 0;
            border-bottom: 1px solid var(--border);
        }

        .friend-row:last-child {
            border-bottom: none;
            padding-bottom: 0;
        }

        .friend-avatar {
            width: 44px;
            height: 44px;
            flex-shrink: 0;
            border-radius: 50%;
            display: grid;
            place-items: center;
            font-size: 1rem;
            font-weight: 900;
            color: #fff;
            background: linear-gradient(135deg, var(--accent), #8b5cf6);
        }

        .friend-info {
            flex: 1;
            min-width: 0;
        }

        .friend-name {
            font-weight: 800;
            font-size: 0.95rem;
            color: var(--text-strong);
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .friend-streak {
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--muted);
            margin-top: 2px;
        }

        .friend-streak .fire {
            color: #f59e0b;
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 700px) {
            body {
                padding: 14px;
            }

            .profile-header {
                flex-direction: column;
                align-items: flex-start;
                padding: 20px;
                text-align: left;
            }

            .avatar {
                width: 84px;
                height: 84px;
                font-size: 2.3rem;
            }

            .header-actions {
                width: 100%;
            }

            .header-actions .btn {
                flex: 1;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
            }

            .stat-value {
                font-size: 1.4rem;
            }

            .section-card {
                padding: 16px;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <main class="page">

        <!-- ============ HEADER ============ -->
        <header class="profile-header">
            <div class="avatar" id="avatar" aria-hidden="true">L</div>
            <div class="identity">
                <h1 id="profileName">Learner</h1>
                <p id="profileEmail">Guest account</p>
            </div>
            <div class="header-actions">
                <a class="btn secondary" href="signin.html" data-account-sign-in hidden>Sign in</a>
                <button class="btn danger" type="button" data-account-sign-out hidden>Sign out</button>
                <a class="btn secondary" href="settings.html">Settings</a>
                <a class="btn" href="dashboard.html">Dashboard</a>
            </div>
        </header>

        <!-- ============ STATS ============ -->
        <section class="stats-row" aria-label="Learning statistics">
            <div class="stat">
                <div class="stat-icon">🔥</div>
                <div class="stat-value" id="streakValue">0</div>
                <div class="stat-label">Day streak</div>
            </div>
            <div class="stat">
                <div class="stat-icon">💎</div>
                <div class="stat-value" id="diamondValue">0</div>
                <div class="stat-label">Diamonds</div>
            </div>
            <div class="stat">
                <div class="stat-icon">⚡</div>
                <div class="stat-value" id="xpValue">0</div>
                <div class="stat-label">Total XP</div>
            </div>
            <div class="stat">
                <div class="stat-icon">📚</div>
                <div class="stat-value" id="lessonValue">0</div>
                <div class="stat-label">Lessons</div>
            </div>
        </section>

        <!-- ============ COURSES ============ -->
        <section class="section-card">
            <div class="section-head">
                <h2>Course progress</h2>
                <a class="link" href="catalog.html">Add a course →</a>
            </div>
            <div id="courseList"></div>
        </section>

        <!-- ============ FRIENDS ============ -->
        <section class="section-card" id="friends">
            <div class="section-head">
                <h2>Friends</h2>
                <a class="link" href="friends.html">Manage →</a>
            </div>
            <div id="friendsList"></div>
        </section>

    </main>

    <script>
        /* ============================================================
           Musalingo — profile page
           ============================================================ */

        // ── SAFE PARSE ──
        function safeParse(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' ? parsed : fallback;
            } catch (err) {
                console.warn(`[profile] Corrupted localStorage for ${key}; using defaults.`, err);
                return fallback;
            }
        }

        const DEFAULT_PROFILE = {
            name: 'Learner',
            email: '',
            streak: 0,
            diamonds: 0,
            xp: 0,
            hearts: 5,
            courses: [],
            friends: []
        };

        const stored = safeParse('MusalingoProfile', null);
        const profile = { ...DEFAULT_PROFILE, ...(stored || {}) };
        const courses = Array.isArray(profile.courses) ? profile.courses : [];
        const rawFriendUids = Array.isArray(profile.friends) ? profile.friends : [];

        const displayName = String(profile.name || 'Learner').trim() || 'Learner';
        const email = profile.email || localStorage.getItem('MusalingoUser') || 'Guest account';

        const completedLessons = courses.reduce((total, course) => {
            return total + (Array.isArray(course.lessons) ? course.lessons.filter(l => l && l.completed).length : 0);
        }, 0);

        // ── HEADER ──
        document.getElementById('profileName').textContent = displayName;
        document.getElementById('profileEmail').textContent = email;
        document.getElementById('avatar').textContent = (displayName[0] || 'L').toUpperCase();

        // ── STATS ──
        document.getElementById('streakValue').textContent = Number(profile.streak) || 0;
        document.getElementById('diamondValue').textContent = Number(profile.diamonds) || 0;
        document.getElementById('xpValue').textContent = Number(profile.xp) || 0;
        document.getElementById('lessonValue').textContent = completedLessons;

        // ── COURSES ──
        const courseList = document.getElementById('courseList');
        if (!courses.length) {
            courseList.innerHTML = '<div class="empty-state">No courses added yet.<br><a href="catalog.html">Choose a course →</a></div>';
        } else {
            courseList.innerHTML = courses.map(course => {
                const progress = Math.min(100, Math.max(0, Number(course.progress) || 0));
                const icon = course.icon || '📘';
                const name = String(course.name || course.id || 'Course');
                return `
                    <div class="course-row">
                        <div class="course-icon" aria-hidden="true">${escapeHtml(icon)}</div>
                        <div class="course-info">
                            <h3>${escapeHtml(name)}</h3>
                            <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${progress}">
                                <div class="progress-fill" style="width:${progress}%"></div>
                            </div>
                        </div>
                        <span class="course-percent">${progress}%</span>
                    </div>
                `;
            }).join('');
        }

        // ── FRIENDS (async — reads real profiles from Firestore when signed in) ──
        const friendsList = document.getElementById('friendsList');
        const isSignedIn = localStorage.getItem('MusalingoLoggedIn') === 'true'
            && localStorage.getItem('MusalingoGuest') !== 'true';
        const uid = localStorage.getItem('MusalingoUid') || '';

        async function renderFriends() {
            if (!isSignedIn || !uid || rawFriendUids.length === 0) {
                friendsList.innerHTML = '<div class="empty-state">No friends yet.<br><a href="friends.html#friends">Add friends →</a></div>';
                return;
            }

            friendsList.innerHTML = '<div class="empty-state">Loading friends…</div>';

            try {
                const fb = await import('./firebase.js');
                const profiles = await fb.loadFriendsProfiles(uid);
                if (!Array.isArray(profiles) || profiles.length === 0) {
                    friendsList.innerHTML = '<div class="empty-state">No friends yet.<br><a href="friends.html#friends">Add friends →</a></div>';
                    return;
                }
                friendsList.innerHTML = profiles.map(f => {
                    const name = String(f.name || f.email || 'Friend');
                    const initial = name[0] ? name[0].toUpperCase() : '?';
                    const streak = Number(f.streak) || 0;
                    return `
                        <div class="friend-row">
                            <div class="friend-avatar" aria-hidden="true">${escapeHtml(initial)}</div>
                            <div class="friend-info">
                                <div class="friend-name">${escapeHtml(name)}</div>
                                <div class="friend-streak"><span class="fire">🔥</span> ${streak} day${streak === 1 ? '' : 's'} streak</div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (err) {
                console.warn('[profile] Could not load friends:', err);
                friendsList.innerHTML = '<div class="empty-state">Could not load friends right now.<br><a href="friends.html#friends">Try the friends page →</a></div>';
            }
        }

        function escapeHtml(s) {
            return String(s ?? '').replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;'
            }[c]));
        }

        renderFriends();
    </script>
    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script type="module" src="account-actions.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
