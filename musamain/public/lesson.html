<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="chessboard.css">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">

    <style>
        :root {
            --text: #3c3c3c;
            --text-light: #afafaf;
            --muted: #afafaf;
            --accent: #58cc02;
            --accent-dark: #46a302;
            --accent-shadow: #58a700;
            --blue: #1cb0f6;
            --blue-dark: #1899d6;
            --red: #ff4b4b;
            --red-dark: #ea2b2b;
            --card: #ffffff;
            --bg: #ffffff;
            --border: #e5e5e5;
            --duo-border: 2px solid #e5e5e5;
            --light: #ebecd0;
            --dark: #739552;
        }

        body.dark-mode {
            --text: #f1f7fb;
            --text-light: #8a9aa6;
            --muted: #8a9aa6;
            --card: #1c2a30;
            --bg: #131f24;
            --border: #2f3e46;
            --duo-border: 2px solid #37464f;
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            font-family: "din-round", "Segoe UI", Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* ===== TOP BAR ===== */
        .top-bar {
            width: min(800px, 100%);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 16px 20px;
            margin-bottom: 20px;
        }

        .close-btn {
            font-size: 1.8rem;
            color: var(--text-light);
            cursor: pointer;
            text-decoration: none;
            font-weight: 900;
            line-height: 1;
        }

        .close-btn:hover {
            color: var(--text);
        }

        .lesson-progress-track {
            flex: 1;
            height: 16px;
            background: var(--border);
            border-radius: 999px;
            overflow: hidden;
            position: relative;
        }

        .lesson-progress-fill {
            width: 0%;
            height: 100%;
            border-radius: inherit;
            background: var(--accent);
            transition: width 0.3s ease;
            position: relative;
        }

        .lesson-progress-fill::after {
            content: "";
            position: absolute;
            top: 4px;
            left: 8px;
            right: 8px;
            height: 4px;
            background: rgba(255, 255, 255, 0.3);
            border-radius: 999px;
        }

        .heart-gauge {
            display: flex;
            align-items: center;
            gap: 4px;
            color: var(--red);
            font-weight: 900;
            font-size: 1.2rem;
            flex-shrink: 0;
        }

        /* ===== MAIN SHELL ===== */
        .shell {
            width: min(800px, 100%);
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 0 20px;
        }

        /* ===== QUESTION AREA ===== */
        .question-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding-top: 10px;
        }

        .title {
            font-size: 1.8rem;
            font-weight: 900;
            margin: 0 0 8px 0;
            color: var(--text);
        }

        .subtitle {
            color: var(--text-light);
            margin: 0 0 24px 0;
            font-size: 1rem;
            font-weight: 700;
        }

        /* ===== DUOLINGO PROMPT LAYOUT ===== */
        .prompt-container {
            display: flex;
            align-items: flex-end;
            /* Aligns bubble to bottom of mascot */
            gap: 16px;
            margin-bottom: 24px;
            cursor: pointer;
            position: relative;
        }

        /* Blue backdrop character area */
        .mascot-wrap {
            width: 140px;
            height: 140px;
            flex-shrink: 0;
            position: relative;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            animation: float 3s ease-in-out infinite;
        }

        .mascot-wrap::before {
            content: "";
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 120px;
            background: #1cb0f6;
            /* Duolingo Blue */
            border-radius: 50%;
            z-index: 0;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-8px);
            }
        }

        .mascot-wrap img {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            object-fit: contain;
            margin-bottom: 5px;
        }

        .mascot-emoji {
            position: relative;
            z-index: 1;
            font-size: 5rem;
            line-height: 1;
            margin-bottom: 5px;
        }

        /* Speech Bubble */
        .speech-bubble {
            background: var(--card);
            border: var(--duo-border);
            border-bottom-width: 4px;
            border-radius: 16px;
            padding: 16px 20px;
            position: relative;
            flex: 1;
            font-size: 1.25rem;
            font-weight: 700;
            color: var(--text);
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            margin-bottom: 10px;
        }

        /* The proper triangular tail pointing left */
        .speech-bubble::before {
            content: "";
            position: absolute;
            left: -10px;
            bottom: 20px;
            width: 0;
            height: 0;
            border-top: 10px solid transparent;
            border-bottom: 10px solid transparent;
            border-right: 12px solid var(--border);
            /* tail color */
        }

        .speech-bubble::after {
            content: "";
            position: absolute;
            left: -7px;
            bottom: 22px;
            width: 0;
            height: 0;
            border-top: 8px solid transparent;
            border-bottom: 8px solid transparent;
            border-right: 10px solid var(--card);
            /* inner tail color */
        }

        /* Audio Controls */
        .audio-controls {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            margin-left: 156px;
        }

        .audio-btn {
            background: var(--bg);
            border: var(--duo-border);
            border-bottom-width: 4px;
            border-radius: 12px;
            padding: 8px 12px;
            font-weight: 800;
            color: var(--blue);
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.1s ease;
        }

        .audio-btn:active {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        /* Meaning Reveal */
        .meaning-reveal {
            background: var(--bg);
            border: var(--duo-border);
            border-radius: 12px;
            padding: 16px;
            margin-top: 16px;
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-light);
            display: none;
            margin-left: 156px;
        }

        .meaning-reveal[hidden] {
            display: none;
        }

        .meaning-reveal:not([hidden]) {
            display: block;
            animation: slideDown 0.2s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .tap-hint {
            font-size: 0.8rem;
            color: var(--text-light);
            text-align: right;
            margin-top: 8px;
            font-weight: 700;
            margin-left: 156px;
        }

        /* ===== OPTIONS GRID ===== */
        .options-area {
            margin-top: auto;
            padding-bottom: 24px;
        }

        .answer-grid {
            display: grid;
            gap: 12px;
            grid-template-columns: 1fr 1fr;
        }

        .answer-btn {
            background: var(--card);
            border: var(--duo-border);
            border-bottom-width: 4px;
            border-radius: 16px;
            padding: 16px;
            cursor: pointer;
            text-align: center;
            font-weight: 800;
            font-size: 1.1rem;
            color: var(--text);
            transition: all 0.1s ease;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 70px;
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(4px);
            border-bottom-width: 2px;
        }

        .answer-btn.selected {
            border-color: var(--blue);
            background: rgba(28, 176, 246, 0.1);
            color: var(--blue);
        }

        .answer-btn.correct {
            border-color: var(--accent);
            background: rgba(88, 204, 2, 0.1);
            color: var(--accent);
        }

        .answer-btn.wrong {
            border-color: var(--red);
            background: rgba(255, 75, 75, 0.1);
            color: var(--red);
        }

        .answer-btn:disabled {
            cursor: not-allowed;
        }

        /* ===== BOTTOM BAR ===== */
        .bottom-bar {
            border-top: var(--duo-border);
            padding: 16px 20px;
            margin-top: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            background: var(--bg);
            width: 100%;
            position: sticky;
            bottom: 0;
        }

        .status-text {
            color: var(--accent);
            font-weight: 900;
            font-size: 1.2rem;
            flex: 1;
        }

        .status-text.wrong-text {
            color: var(--red);
        }

        .status-text.neutral-text {
            color: var(--text-light);
        }

        .action-buttons {
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            border-radius: 16px;
            font-weight: 900;
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border: none;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.1s ease;
            box-shadow: 0 4px 0 var(--accent-shadow);
            background: var(--accent);
            color: #fff;
            min-width: 140px;
        }

        .btn:active:not(:disabled) {
            transform: translateY(4px);
            box-shadow: 0 0 0 transparent;
        }

        .btn:disabled {
            background: var(--border);
            color: var(--text-light);
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn.secondary {
            background: transparent;
            color: var(--text-light);
            box-shadow: none;
            border: 2px solid var(--border);
        }

        .btn.secondary:active {
            background: var(--border);
            transform: none;
        }

        /* ===== COMPLETION PANEL ===== */
        .completion-panel {
            background: var(--card);
            border: var(--duo-border);
            border-radius: 24px;
            padding: 32px;
            text-align: center;
            margin-top: 32px;
            box-shadow: 0 4px 0 var(--border);
        }

        .completion-panel h2 {
            font-size: 2rem;
            color: var(--accent);
            margin-top: 0;
        }

        .completion-stats {
            display: flex;
            justify-content: center;
            gap: 40px;
            margin: 24px 0;
        }

        .completion-stat strong {
            display: block;
            font-size: 2rem;
            color: var(--text);
        }

        .completion-stat span {
            display: block;
            font-size: 0.9rem;
            color: var(--text-light);
            font-weight: 700;
            text-transform: uppercase;
        }

        .chess-activity {
            margin: 20px 0;
            margin-left: 156px;
        }

        @media (max-width: 700px) {
            .top-bar {
                padding: 12px;
            }

            .shell {
                padding: 0 12px;
            }

            .answer-grid {
                grid-template-columns: 1fr;
            }

            .prompt-container {
                flex-direction: column;
                align-items: center;
                gap: 0;
            }

            .mascot-wrap {
                width: 120px;
                height: 120px;
                margin-bottom: -20px;
                z-index: 2;
            }

            .mascot-wrap::before {
                width: 100px;
                height: 100px;
            }

            /* Fix tail for mobile (pointing up) */
            .speech-bubble::before {
                left: 50%;
                bottom: auto;
                top: -10px;
                transform: translateX(-50%);
                border-left: 10px solid transparent;
                border-right: 10px solid transparent;
                border-bottom: 12px solid var(--border);
                border-top: 0;
            }

            .speech-bubble::after {
                left: 50%;
                bottom: auto;
                top: -7px;
                transform: translateX(-50%);
                border-left: 8px solid transparent;
                border-right: 8px solid transparent;
                border-bottom: 10px solid var(--card);
                border-top: 0;
            }

            .audio-controls,
            .meaning-reveal,
            .tap-hint,
            .chess-activity {
                margin-left: 0;
            }

            .bottom-bar {
                flex-direction: column;
                align-items: stretch;
                gap: 12px;
            }

            .action-buttons {
                justify-content: flex-end;
            }

            .btn {
                flex: 1;
                padding: 14px 16px;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- TOP BAR -->
    <div class="top-bar">
        <a class="close-btn" id="exitBtn" href="dashboard.html" aria-label="Exit lesson">✕</a>
        <div class="lesson-progress-track">
            <div class="lesson-progress-fill" id="lessonProgressFill"></div>
        </div>
        <div class="heart-gauge" id="heartGauge" role="status" aria-label="Hearts">
            <span class="icon" aria-hidden="true">❤️</span>
            <span class="heart-gauge-count" id="heartGaugeCount"></span>
        </div>
    </div>

    <div class="shell">
        <div class="question-area">
            <h1 class="title" id="lessonTitle">Lesson</h1>
            <p class="subtitle" id="lessonSubtitle">Loading lesson…</p>

            <!-- DUOLINGO PROMPT: CHARACTER + SPEECH BUBBLE -->
            <div class="prompt-container" id="promptContainer" role="button" tabindex="0" aria-expanded="false">
                <div class="mascot-wrap" id="mascotWrap">
                    <img src="/characters/human.png" alt="Character" id="mascotImg"
                        onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
                    <span class="mascot-emoji" id="mascotEmoji" style="display:none;">🧑‍🎨</span>
                </div>
                <div class="speech-bubble" id="promptText">
                    Loading…
                </div>
            </div>

            <div class="audio-controls" id="audioControls" aria-label="Question audio controls">
                <button class="audio-btn" id="normalVoiceBtn" type="button" title="Play at normal speed">🔊
                    Normal</button>
                <button class="audio-btn" id="slowVoiceBtn" type="button" title="Play slowly">🐢 Slow</button>
            </div>

            <div class="tap-hint" id="meaningHint">Tap the question to reveal its meaning</div>
            <div class="meaning-reveal" id="meaningReveal" hidden></div>

            <div class="chess-activity" id="chessActivity" hidden></div>
        </div>

        <div class="options-area">
            <div class="answer-grid" id="options"></div>
        </div>

        <div class="completion-panel" id="completionPanel" hidden>
            <h2 id="completionHeading">Lesson complete!</h2>
            <div class="completion-stats">
                <div class="completion-stat">
                    <strong id="completionAccuracy">0%</strong>
                    <span id="accuracyLabel">Accuracy</span>
                </div>
                <div class="completion-stat">
                    <strong id="completionXp">+20</strong>
                    <span id="xpEarnedLabel">XP earned</span>
                </div>
            </div>
            <a class="btn" id="backDashboardLink" href="dashboard.html">Continue</a>
        </div>

        <div class="bottom-bar">
            <div class="status-text" id="statusText">Complete the lesson to earn rewards.</div>
            <div class="action-buttons" style="display:flex; gap:8px; flex-wrap:wrap;">
                <button class="btn secondary" id="hintBtn" style="display:none;">Hint</button>
                <button class="btn" id="checkBtn" style="display:none;">Check</button>
                <button class="btn" id="nextBtn" style="display:none;">Next</button>
                <button class="btn" id="finishBtn" disabled>Finish</button>
            </div>
        </div>
    </div>

    <!-- Hidden nodes required by lesson.js -->
    <div id="feedback" class="message" style="display:none;"></div>
    <div id="promptHeading" style="display:none;"></div>
    <div class="lesson-progress-count" id="lessonProgressCount" style="display:none;"></div>
    <div id="lessonProgressTrack" role="progressbar" style="display:none;"></div>

    <script src="sounds.js"></script>
    <script src="chessboard.js"></script>
    <script src="audience.js"></script>
    <script src="questions.js"></script>
    <script src="hearts.js"></script>
    <script type="module" src="lesson.js"></script>
    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
