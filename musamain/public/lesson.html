<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lesson - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <link rel="stylesheet" href="chessboard.css">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">

    <style>
        :root {
            --text: #1f2937;
            --muted: #6b7280;
            --accent: #EC96C7;
            --accent-dark: #a83272;
            --blue: #2b70c9;
            --card: #ffffff;
            --bg: #f7f8fc;
            --border: #e5e7eb;
            --light: #ebecd0;
            --dark: #739552;
        }

        body.dark-mode {
            --text: #e5e7eb;
            --muted: #aeb9ca;
            --accent-dark: #f4a1cd;
            --card: #1f2937;
            --bg: #111827;
            --border: #374151;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #fdf2f8 0%, #f4f8ff 100%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
        }

        body.dark-mode .card {
            background: #273449;
            border-color: #374151;
        }

        body.dark-mode .answer-btn {
            background: #1f2937;
            border-color: #4b5563;
            color: var(--text);
        }

        body.dark-mode .audio-btn {
            background: #1f2937;
            border-color: #6b7280;
            color: var(--text);
        }

        body.dark-mode .answer-btn.correct,
        body.dark-mode .completion-panel {
            background: #4b2941;
            border-color: #713f5f;
            color: #fff;
        }

        body.dark-mode .answer-btn.wrong {
            background: #45242b;
            border-color: #7f1d1d;
            color: #fff;
        }

        body.dark-mode .spell-input,
        body.dark-mode .translate-input {
            background: #1f2937;
            border-color: #6b7280;
            color: var(--text);
        }

        body.dark-mode .spell-input::placeholder,
        body.dark-mode .translate-input::placeholder {
            color: #aeb9ca;
            opacity: 1;
        }

        body.dark-mode .match-item {
            background: #1f2937;
            border-color: #6b7280;
            color: var(--text);
        }

        body.dark-mode .match-item.selected {
            background: #1e3a5f;
            border-color: #60a5fa;
        }

        body.dark-mode .match-item.matched {
            background: #14532d;
            border-color: #22c55e;
            color: #dcfce7;
        }

        body.dark-mode .arrange-target {
            background: #1e3a5f;
            border-color: #6b7280;
        }

        body.dark-mode .arrange-pool {
            background: #1f2937;
            border-color: #6b7280;
        }

        body.dark-mode .arrange-word {
            background: #273449;
            border-color: #6b7280;
            color: var(--text);
        }

        body.dark-mode .arrange-word.in-target {
            background: #4b2941;
            border-color: #d477ae;
        }

        body.dark-mode #graphSvg {
            background: #1f2937;
        }

        body.dark-mode .message {
            color: #f4a1cd;
        }

        .page {
            min-height: calc(100vh - 40px);
            display: grid;
            place-items: center;
        }

        .shell {
            width: min(760px, 100%);
            background: var(--card);
            border-radius: 28px;
            padding: 28px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.12);
        }

        .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
        }

        .lesson-progress {
            margin: 0 0 18px;
        }

        .lesson-progress-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 7px;
            color: var(--muted);
            font-size: 0.82rem;
            font-weight: 700;
        }

        .lesson-progress-count {
            color: var(--text);
            font-variant-numeric: tabular-nums;
        }

        .lesson-progress-track {
            height: 12px;
            overflow: hidden;
            border: 1px solid var(--border);
            border-radius: 999px;
            background: #e5e7eb;
            box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.08);
        }

        .lesson-progress-fill {
            width: 0;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, #7ed957, #58cc02);
            box-shadow: 0 1px 2px rgba(42, 133, 0, 0.22);
            transition: width 0.35s ease;
        }

        body.dark-mode .lesson-progress-track {
            background: #374151;
        }

        .heart-gauge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex: 0 0 auto;
            color: var(--muted);
            font-weight: 800;
        }

        .heart-gauge .icon {
            font-size: 1.2rem;
        }

        .heart-gauge-count {
            font-size: 1rem;
        }

        .title {
            font-size: 1.5rem;
            font-weight: 800;
            margin: 0;
        }

        .subtitle {
            color: var(--muted);
            margin: 6px 0 0;
        }

        .card {
            background: #f9fcff;
            border: 1px solid #e2ebff;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
        }

        .card h3 {
            margin: 0 0 8px;
            font-size: 1.1rem;
        }

        .prompt-heading {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
        }

        .question-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .audio-controls {
            display: flex;
            flex: 0 0 auto;
            gap: 6px;
        }

        .audio-btn {
            border: 1px solid #d1d5db;
            border-radius: 8px;
            padding: 5px 8px;
            background: #fff;
            color: var(--text);
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .audio-btn:hover {
            border-color: var(--blue);
        }

        .card p {
            margin: 0 0 14px;
            color: var(--muted);
        }

        .heart-gate {
            display: grid;
            gap: 12px;
        }

        .heart-gate p {
            margin: 0;
            color: var(--muted);
            font-weight: 700;
        }

        .heart-gate [hidden] {
            display: none !important;
        }

        #promptText {
            flex: 1;
            min-width: 0;
        }

        .blank {
            display: inline-block;
            min-width: 60px;
            border-bottom: 2px solid var(--accent);
            text-align: center;
            color: var(--accent-dark);
            font-weight: 700;
        }

        /* ---------- Answer buttons ---------- */
        .answer-grid {
            display: grid;
            gap: 10px;
            grid-template-columns: 1fr 1fr;
        }

        .answer-btn {
            border: 1px solid #d1d5db;
            background: #fff;
            border-radius: 12px;
            padding: 12px 14px;
            cursor: pointer;
            text-align: left;
            font-weight: 600;
            color: var(--text);
        }

        .answer-choice {
            display: block;
        }

        .answer-pronunciation {
            display: block;
            margin-top: 4px;
            color: var(--muted);
            font-size: 0.875rem;
            font-weight: 500;
        }

        .answer-btn.correct {
            background: #fdf2f8;
            border-color: #f7bfdc;
        }

        .answer-btn.wrong {
            background: #fff1f2;
            border-color: #fecdd3;
        }

        .answer-btn:disabled {
            cursor: not-allowed;
            opacity: 0.8;
        }

        .answer-btn.selected {
            border-color: var(--blue);
            box-shadow: 0 0 0 2px rgba(43, 112, 201, 0.2);
        }

        /* ---------- Match pairs ---------- */
        .match-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .match-col {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .match-item {
            padding: 12px 14px;
            border-radius: 12px;
            border: 2px solid #d1d5db;
            background: #fff;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .match-item.selected {
            border-color: var(--blue);
            background: #eff6ff;
        }

        .match-item.matched {
            border-color: #22c55e;
            background: #dcfce7;
            opacity: 0.7;
            cursor: default;
        }

        .match-item.shake {
            animation: shake 0.4s;
        }

        @keyframes shake {

            0%,
            100% {
                transform: translateX(0);
            }

            25% {
                transform: translateX(-6px);
            }

            75% {
                transform: translateX(6px);
            }
        }

        /* ---------- Arrange ---------- */
        .arrange-target,
        .arrange-pool {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 48px;
            padding: 10px;
            border: 2px dashed #d1d5db;
            border-radius: 12px;
            margin-bottom: 12px;
        }

        .arrange-target {
            background: #f0f9ff;
        }

        .arrange-pool {
            background: #fafafa;
        }

        .arrange-word {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            background: #fff;
            font-weight: 600;
            cursor: pointer;
        }

        .arrange-word.in-target {
            background: #fdf2f8;
            border-color: #f7bfdc;
        }

        /* ---------- Slider ---------- */
        .slider-wrap {
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 20px 8px;
        }

        .slider-wrap input[type=range] {
            width: 100%;
            accent-color: var(--accent);
            height: 8px;
        }

        .slider-value {
            font-size: 1.5rem;
            font-weight: 800;
            text-align: center;
            color: var(--accent-dark);
        }

        /* ---------- Graph ---------- */
        .graph-wrap {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            padding: 12px;
        }

        #graphSvg {
            background: #fafafa;
            border-radius: 12px;
            cursor: crosshair;
            max-width: 100%;
        }

        /* ---------- Spell ---------- */
        .spell-input {
            width: 100%;
            padding: 14px 16px;
            font-size: 1.1rem;
            border: 2px solid #d1d5db;
            border-radius: 12px;
            outline: none;
            background: #fff;
            color: var(--text);
        }

        #translateInput {
            min-height: 64px;
            font-size: 1.15rem;
            padding: 16px 18px;
        }

        .spell-input:focus {
            border-color: var(--blue);
        }

        /* ---------- Speak ---------- */
        .speak-wrap {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        /* ---------- Misc ---------- */
        .message {
            margin-top: 10px;
            font-weight: 600;
            color: var(--accent-dark);
        }

        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-top: 14px;
        }

        .btn {
            display: inline-block;
            padding: 10px 14px;
            border-radius: 999px;
            background: var(--accent);
            color: white;
            text-decoration: none;
            font-weight: 700;
            box-shadow: 0 6px 0 var(--accent-shadow, var(--accent-dark));
            border: none;
            cursor: pointer;
        }

        .btn.secondary {
            background: var(--blue);
            box-shadow: 0 6px 0 #205ea5;
        }

        .completion-panel {
            background: #fdf2f8;
            border: 1px solid #f7bfdc;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
        }

        .completion-panel[hidden] {
            display: none;
        }

        .completion-panel h2 {
            margin: 0 0 14px;
        }

        .completion-stats {
            display: flex;
            justify-content: center;
            gap: 28px;
            margin-bottom: 20px;
        }

        .completion-stat strong,
        .completion-stat span {
            display: block;
        }

        .completion-stat strong {
            font-size: 1.5rem;
        }

        .completion-stat span {
            color: var(--muted);
            font-size: 0.9rem;
        }

        body.practice-mode {
            background: linear-gradient(135deg, #fdf2f8 0%, #f4f8ff 100%);
        }

        body.dark-mode.practice-mode {
            background: linear-gradient(135deg, #111827 0%, #1f2937 100%);
        }

        body.practice-mode .shell {
            border: 2px solid color-mix(in srgb, var(--accent) 45%, var(--border));
            border-top-width: 6px;
        }

        body.practice-mode .completion-panel {
            border-color: color-mix(in srgb, var(--accent) 40%, var(--border));
        }

        @media (max-width: 700px) {
            body {
                padding: 14px;
            }

            .page {
                min-height: auto;
            }

            .shell {
                padding: 18px 16px;
                border-radius: 18px;
            }

            .top-row,
            .actions {
                flex-direction: column;
                align-items: flex-start;
            }

            .answer-grid,
            .match-grid {
                grid-template-columns: 1fr;
            }

            .question-row {
                align-items: flex-start;
                flex-wrap: wrap;
            }

            .btn {
                width: 100%;
                text-align: center;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="page">
        <div class="shell">
            <div class="top-row">
                <div>
                    <h1 class="title" id="lessonTitle">Lesson</h1>
                    <p class="subtitle" id="lessonSubtitle">Loading lesson…</p>
                </div>
                <div class="heart-gauge" id="heartGauge" role="status" aria-label="Hearts">
                    <span class="icon" aria-hidden="true">❤️</span>
                    <span class="heart-gauge-count" id="heartGaugeCount"></span>
                </div>
            </div>
            <div class="lesson-progress">
                <div class="lesson-progress-meta">
                    <span id="lessonProgressLabel">Lesson progress</span>
                    <span class="lesson-progress-count" id="lessonProgressCount">0 / 0</span>
                </div>
                <div class="lesson-progress-track" id="lessonProgressTrack" role="progressbar"
                    aria-label="Lesson progress" aria-valuemin="0" aria-valuemax="0" aria-valuenow="0">
                    <div class="lesson-progress-fill" id="lessonProgressFill"></div>
                </div>
            </div>
            <div class="card">
                <h3 class="prompt-heading" id="promptHeading">Practice prompt</h3>
                <div class="question-row">
                    <p id="promptText">Loading…</p>
                    <div class="audio-controls" id="audioControls" aria-label="Question audio controls">
                        <button class="audio-btn" id="normalVoiceBtn" type="button"
                            title="Play at normal speed">Normal</button>
                        <button class="audio-btn" id="slowVoiceBtn" type="button" title="Play slowly">Slow</button>
                    </div>
                </div>
                <div class="chess-activity" id="chessActivity" hidden></div>
                <div class="answer-grid" id="options"></div>
                <div class="message" id="feedback"></div>
            </div>
            <div class="completion-panel" id="completionPanel" hidden>
                <h2 id="completionHeading">Lesson complete!</h2>
                <div class="completion-stats">
                    <div class="completion-stat"><strong id="completionAccuracy">0%</strong><span id="accuracyLabel">Accuracy</span></div>
                    <div class="completion-stat"><strong id="completionXp">+20</strong><span id="xpEarnedLabel">XP earned</span></div>
                </div>
                <a class="btn" id="backDashboardLink" href="dashboard.html">Back to dashboard</a>
            </div>
            <div class="actions">
                <div id="statusText">Complete the lesson to earn rewards.</div>
                <div style="display:flex; gap:8px; flex-wrap:wrap;">
                    <a class="btn secondary" id="exitBtn" href="dashboard.html">Exit</a>
                    <button class="btn secondary" id="hintBtn" style="display:none;">Hint</button>
                    <button class="btn" id="checkBtn" style="display:none;">Check</button>
                    <button class="btn secondary" id="nextBtn" style="display:none;">Next</button>
                    <button class="btn" id="finishBtn" disabled>Finish lesson</button>
                </div>
            </div>
        </div>
    </div>

    <script src="sounds.js"></script>
    <script src="chessboard.js"></script>
    <script src="questions.js"></script>
    <script type="module" src="lesson.js?v=27"></script>
    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
</body>

</html>
