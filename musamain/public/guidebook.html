<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="/icons/logo.png">
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Guidebook - Musalingo</title>
    <link rel="manifest" href="/manifest.json">
    <meta name="theme-color" content="#EC96C7">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Musalingo">
    <meta name="description" content="Musalingo — free, open source language learning. Cheaper than chai.">
    <style>
        :root {
            color-scheme: dark;
            --bg: #131f24;
            --card: #1c2a30;
            --card-2: #223238;
            --text: #f1f7fb;
            --text-strong: #ffffff;
            --muted: #8a9aa6;
            --accent: #EC96C7;
            --accent-dark: #C46AA1;
            --blue: #1cb0f6;
            --border: #2f3e46;
            --bubble: #2b3a42;
            --shadow: rgba(0, 0, 0, .28);
            --gold: #ffc800;
        }

        body.light-mode {
            color-scheme: light;
            --bg: #f7f8fc;
            --card: #ffffff;
            --card-2: #f3f6fb;
            --text: #1f2937;
            --text-strong: #111827;
            --muted: #6b7280;
            --border: #e5e7eb;
            --bubble: #eef2f7;
            --shadow: rgba(15, 23, 42, .08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 24px 16px 80px;
            transition: background 0.2s ease, color 0.2s ease;
            -webkit-font-smoothing: antialiased;
        }

        .wrap {
            max-width: 760px;
            margin: 0 auto;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            color: var(--muted);
            font-weight: 700;
            text-decoration: none;
            padding: 8px 0;
            margin-bottom: 14px;
            font-size: 1.05rem;
        }

        .back-link:hover {
            color: var(--text);
        }

        /* ===== HERO ===== */
        .hero {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 18px 8px 26px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 28px;
        }

        .hero-art {
            font-size: 4.2rem;
            line-height: 1;
            user-select: none;
            filter: drop-shadow(0 6px 12px var(--shadow));
        }

        .hero-text h1 {
            margin: 0 0 6px;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-strong);
            letter-spacing: -.02em;
        }

        .hero-text p {
            margin: 0;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.95rem;
        }

        /* ===== CTA BUTTONS ===== */
        .cta-row {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 14px;
        }

        .cta {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-height: 44px;
            padding: 0 18px;
            border-radius: 13px;
            border: 0;
            background: var(--accent);
            box-shadow: 0 4px 0 var(--accent-dark);
            color: #fff;
            font-weight: 800;
            font-size: 0.88rem;
            letter-spacing: 0.03em;
            text-transform: uppercase;
            text-decoration: none;
            cursor: pointer;
            transition: transform 0.08s ease, filter 0.15s ease, box-shadow 0.08s ease;
        }

        .cta:hover {
            filter: brightness(1.06);
            transform: translateY(-1px);
        }

        .cta:active {
            transform: translateY(3px);
            box-shadow: 0 1px 0 var(--accent-dark);
        }

        .cta.secondary {
            background: var(--card);
            color: var(--text);
            box-shadow: 0 4px 0 var(--border);
            border: 2px solid var(--border);
        }

        .cta.secondary:active {
            box-shadow: 0 1px 0 var(--border);
        }

        /* ===== SECTION LABEL ===== */
        .section-label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            color: var(--accent);
            font-weight: 800;
            font-size: 0.82rem;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin: 0 0 14px;
        }

        .section-label .count {
            color: var(--muted);
            font-size: 0.72rem;
            letter-spacing: 0.04em;
            text-transform: none;
        }

        /* ===== PHRASE / WORD LIST ===== */
        .phrase-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .phrase {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 16px 18px;
            background: var(--card);
            border: 2px solid var(--border);
            border-radius: 16px;
            cursor: pointer;
            transition: border-color 0.15s ease, transform 0.1s ease, box-shadow 0.15s ease;
        }

        .phrase:hover {
            border-color: var(--accent);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px var(--shadow);
        }

        .speaker-btn {
            flex-shrink: 0;
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: var(--bubble);
            border: none;
            color: var(--accent);
            font-size: 1.3rem;
            cursor: pointer;
            display: grid;
            place-items: center;
            transition: background 0.15s ease, transform 0.08s ease;
        }

        .speaker-btn:hover {
            background: color-mix(in srgb, var(--accent) 18%, var(--bubble));
        }

        .speaker-btn:active {
            transform: scale(0.94);
        }

        .phrase-text {
            flex: 1;
            min-width: 0;
        }

        .phrase-target {
            font-size: 1.12rem;
            font-weight: 800;
            margin-bottom: 4px;
            color: var(--text-strong);
            word-break: break-word;
        }

        .phrase-en {
            color: var(--muted);
            font-weight: 600;
            font-size: 0.9rem;
        }

        .word-meta {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 6px;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 2px 8px;
            border-radius: 99px;
            background: var(--card-2);
            color: var(--muted);
            font-size: 0.68rem;
            font-weight: 800;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .badge.mastered {
            background: color-mix(in srgb, var(--gold) 18%, var(--card-2));
            color: var(--gold);
        }

        .badge.learning {
            background: color-mix(in srgb, var(--blue) 16%, var(--card-2));
            color: var(--blue);
        }

        .badge.starter {
            background: var(--card-2);
            color: var(--muted);
        }

        .badge.stat {
            text-transform: none;
            letter-spacing: 0;
        }

        /* ===== EMPTY / HINT ===== */
        .hint {
            padding: 22px;
            border-radius: 16px;
            border: 2px dashed var(--border);
            background: var(--card);
            color: var(--muted);
            font-weight: 600;
            font-size: 0.92rem;
            line-height: 1.5;
            text-align: center;
        }

        .hint strong {
            color: var(--text);
            display: block;
            margin-bottom: 4px;
        }

        /* ===== TIP BLOCK ===== */
        .tip-block {
            margin-top: 28px;
            padding: 16px 18px;
            background: var(--card);
            border-left: 4px solid var(--accent);
            border-radius: 12px;
            color: var(--muted);
            font-weight: 600;
            font-size: 0.92rem;
            line-height: 1.55;
        }

        .tip-block strong {
            color: var(--text);
        }

        /* ===== FOOTER CTA ===== */
        .footer-cta {
            margin-top: 30px;
            padding: 20px;
            border-radius: 18px;
            background: linear-gradient(120deg, color-mix(in srgb, var(--accent) 18%, var(--card)), var(--card) 70%);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--border));
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }

        .footer-cta-text strong {
            display: block;
            color: var(--text-strong);
            font-size: 1.02rem;
            font-weight: 800;
            margin-bottom: 4px;
        }

        .footer-cta-text span {
            color: var(--muted);
            font-size: 0.86rem;
            font-weight: 600;
        }

        @media (max-width: 620px) {
            .hero-art {
                font-size: 3.2rem;
            }

            .hero-text h1 {
                font-size: 1.25rem;
            }

            .phrase-target {
                font-size: 1.04rem;
            }

            .footer-cta {
                flex-direction: column;
                align-items: stretch;
            }

            .footer-cta .cta {
                justify-content: center;
            }
        }
    </style>
    <link rel="stylesheet" href="styles.css">
</head>

        // ============================================================

        // ============================================================

        // ---------- 0. SAFE PARSE ----------
        function safeParse(key, fallback) {
            try {
                const raw = localStorage.getItem(key);
                if (!raw) return fallback;
                const parsed = JSON.parse(raw);
                return parsed && typeof parsed === 'object' ? parsed : fallback;
            } catch (err) {
                console.warn(`[guidebook] Corrupted localStorage for ${key}; using defaults.`, err);
                return fallback;
            }
        }

        function finiteInt(value, fallback) {
            const n = Number(value);
            return Number.isFinite(n) ? Math.max(0, Math.floor(n)) : fallback;
        }

        function esc(value) {
            return String(value ?? '')
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // ---------- 1. SETTINGS (theme + accent) ----------
        const settings = safeParse('MusalingoSettings', {});

        // FIX: honor both 'dark' and 'light'. Previously only 'light' was handled,
        // which meant the page was dark-by-default even when a user picked 'dark'
        // and never flipped to light on 'light' + system preference.
        if (settings.theme === 'light') {
            document.body.classList.add('light-mode');
        } else if (settings.theme === 'dark') {
            document.body.classList.remove('light-mode');
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) {
            document.body.classList.add('light-mode');
        }

        if (settings.accent) {
            document.documentElement.style.setProperty('--accent', settings.accent);
            document.documentElement.style.setProperty('--accent-dark', darken(settings.accent, 0.2));
        }

        function darken(hex, amount) {
            const c = String(hex).replace('#', '');
            if (c.length !== 6) return hex;
            const r = parseInt(c.slice(0, 2), 16);
            const g = parseInt(c.slice(2, 4), 16);
            const b = parseInt(c.slice(4, 6), 16);
            const adj = v => Math.max(0, Math.min(255, Math.round(v * (1 - amount))));
            return '#' + adj(r).toString(16).padStart(2, '0')
                + adj(g).toString(16).padStart(2, '0')
                + adj(b).toString(16).padStart(2, '0');
        }

        // ---------- 2. URL PARAMS ----------
        const params = new URLSearchParams(window.location.search);
        const courseId = params.get('courseId') || 'japanese';
        const sectionNo = params.get('section') || '1';

                    art: '🧑‍🎨',
                    phrases: [
                        { target: 'أين المحطة؟', en: 'Where is the station?' },

            // ===== ENGLISH =====
            english: {
                1: {

                    intro: 'Greetings and introductions',
                    art: '🧑‍🎨',
                    phrases: [
                        { target: 'Hello!', en: '¡Hola!' },

                    ],

                    phrases: [

                        { target: 'Please', en: 'Por favor' },
                        { target: 'Goodbye', en: 'Adiós' }
                    ],
                    tip: '<strong>Tip:</strong> "Please" and "thank you" make requests polite.'
                },
                3: {
                    title: 'Unit 3 Guidebook',
                    intro: 'Useful expressions',
                    art: '🧑‍🎨',
                    phrases: [

                        { target: 'I do not understand', en: 'No entiendo' },
                        { target: 'Can you help me?', en: '¿Puedes ayudarme?' }
                    ],
                    tip: '<strong>Tip:</strong> Use "could" instead of "can" for polite requests.'

            // ===== CHESS =====
            chess: {
                1: {
                    title: 'Section 1 Guidebook',
                    intro: 'Piece movement and board basics',
                    art: '♟',
                    phrases: [
                        { target: 'Pawn', en: 'Moves forward 1 (or 2 from start). Captures diagonally.' },
                        { target: 'Knight', en: 'Moves in an L-shape: 2 + 1.' },
                        { target: 'Bishop', en: 'Moves diagonally, any distance.' },
                        { target: 'Rook', en: 'Moves in straight lines: ranks and files.' }
                    ],
                    tip: '<strong>Tip:</strong> Control the center four squares (d4, e4, d5, e5) early.'
                },
                2: {
                    title: 'Section 2 Guidebook',
                    intro: 'Captures and tactics',
                    art: '♞',
                    phrases: [
                        { target: 'Capture', en: "Move onto an enemy piece's square to take it." },
                        { target: 'Fork', en: 'Attack two pieces at once with one piece.' },
                        { target: 'Pin', en: 'Attack a piece so moving it exposes a bigger piece.' },
                        { target: 'Skewer', en: 'Attack a valuable piece so it must move, exposing a lesser one.' }
                    ],
                    tip: '<strong>Tip:</strong> Before every move, ask: "Is my piece safe there?"'
                },
                3: {
                    title: 'Section 3 Guidebook',
                    intro: 'Skewers, pins, and escaping them',
                    art: '🧔',
                    phrases: [
                        { target: 'Skewer', en: 'Attack the king first, then capture the piece behind.' },
                        { target: 'Absolute pin', en: 'Pinned piece cannot move — king is behind it.' },
                        { target: 'Relative pin', en: 'Pinned piece can move, but at a cost.' },
                        { target: 'Escape a pin', en: 'Move the king, block the line, or capture the attacker.' }
                    ],
                    tip: '<strong>Tip:</strong> Look for pins along the same rank, file, or diagonal.'
                },
                4: {
                    title: 'Section 4 Guidebook',
                    intro: 'Endgames and checkmate patterns',
                    art: '♔',
                    phrases: [
                        { target: 'Checkmate', en: 'King is in check and cannot escape.' },
                        { target: 'Stalemate', en: 'Player has no legal moves but is not in check — draw.' },
                        { target: 'Promotion', en: 'Pawn reaches the last rank and becomes a queen.' },
                        { target: 'King + pawn', en: 'Key endgame. Push the pawn, escort with the king.' }
                    ],
                    tip: '<strong>Tip:</strong> In king + pawn endgames, the king must lead the pawn.'
                }
            },

            // ===== MATH =====
            math: {
                1: {
                    title: 'Grade 1 Guidebook',
                    intro: 'Addition basics',
                    art: '➕',
                    phrases: [
                        { target: '2 + 3 = 5', en: 'Two plus three equals five.' },
                        { target: '4 + 4 = 8', en: 'Four plus four equals eight.' },
                        { target: '10 + 5 = 15', en: 'Ten plus five equals fifteen.' }
                    ],
                    tip: '<strong>Tip:</strong> Start with the bigger number and count up.'
                },
                2: {
                    title: 'Grade 2 Guidebook',
                    intro: 'Multiplication tables',
                    art: '✖️',
                    phrases: [
                        { target: '3 × 4 = 12', en: 'Three times four equals twelve.' },
                        { target: '5 × 6 = 30', en: 'Five times six equals thirty.' },
                        { target: '7 × 8 = 56', en: 'Seven times eight equals fifty-six.' }
                    ],
                    tip: '<strong>Tip:</strong> Learn 2×, 5×, 10× first — they are the easiest patterns.'
                },
                3: {
                    title: 'Grade 3 Guidebook',
                    intro: 'Division and fractions',
                    art: '➗',
                    phrases: [
                        { target: '12 ÷ 4 = 3', en: 'Twelve divided by four equals three.' },
                        { target: '1/2 = 0.5', en: 'One half equals zero point five.' },
                        { target: '3/4 = 0.75', en: 'Three quarters equals zero point seven five.' }
                    ],
                    tip: '<strong>Tip:</strong> Division is the opposite of multiplication.'
                }
            },

            // ===== MUSIC =====
            music: {
                1: {
                    title: 'Unit 1 Guidebook',
                    intro: 'Rhythm and beat',
                    art: '🎵',
                    phrases: [
                        { target: 'Do', en: 'First note of the scale' },
                        { target: 'Re', en: 'Second note' },
                        { target: 'Mi', en: 'Third note' }
                    ],
                    tip: '<strong>Tip:</strong> Clap on each beat to feel the rhythm.'
                },
                2: {
                    title: 'Unit 2 Guidebook',
                    intro: 'Continuing the scale',
                    art: '🎶',
                    phrases: [
                        { target: 'Fa', en: 'Fourth note' },
                        { target: 'Sol', en: 'Fifth note' },
                        { target: 'La', en: 'Sixth note' }
                    ],
                    tip: '<strong>Tip:</strong> The 5th note (Sol) is the strongest after Do.'
                },
                3: {
                    title: 'Unit 3 Guidebook',
                    intro: 'Completing the scale',
                    art: '🎼',
                    phrases: [
                        { target: 'Ti', en: 'Seventh note' },
                        { target: 'Do (high)', en: 'Octave — start of the next scale' }
                    ],
                    tip: '<strong>Tip:</strong> Ti creates tension that resolves to Do.'
                }
            }
        };

        // Accept both the new {target} shape and the old {jp} shape.
        function normalizeGuide(g) {
            if (!g || typeof g !== 'object') return null;
            const phrases = Array.isArray(g.phrases) ? g.phrases.map(p => ({
                target: String(p?.target ?? p?.jp ?? ''),
                en: String(p?.en ?? '')
            })).filter(p => p.target) : [];
            return {
                title: String(g.title || ''),
                intro: String(g.intro || ''),
                art: String(g.art || '🧑‍🎨'),
                phrases,
                tip: typeof g.tip === 'string' ? g.tip : ''
            };
        }

        function defaultGuide() {
            return {
                title: `Unit ${sectionNo} Guidebook`,
                intro: 'Explore grammar tips and key phrases for this unit',
                art: '🧑‍🎨',
                phrases: [],
                tip: ''
            };
        }

        const courseGuides = GUIDES[courseId] || {};
        const guide = normalizeGuide(courseGuides[sectionNo]) || defaultGuide();

        // ---------- 4. LESSON WORDS (read-only) ----------
        const LANGUAGE_CODES = {
            English: 'en-US', Spanish: 'es-ES', French: 'fr-FR', German: 'de-DE',
            Italian: 'it-IT', Japanese: 'ja-JP', Hindi: 'hi-IN', Arabic: 'ar-SA',
            Korean: 'ko-KR', Telugu: 'te-IN'
        };

        const COURSE_ID_TO_LANG = {
            japanese: 'Japanese', spanish: 'Spanish', french: 'French', german: 'German',
            italian: 'Italian', hindi: 'Hindi', arabic: 'Arabic', english: 'English',
            korean: 'Korean', telugu: 'Telugu', chinese: 'Chinese', portuguese: 'Portuguese',
            russian: 'Russian', turkish: 'Turkish',
            chess: 'English', math: 'English', music: 'English'
        };

        const COURSE_ID_TO_DISPLAY = {
            japanese: 'Japanese', spanish: 'Spanish', french: 'French', german: 'German',
            italian: 'Italian', hindi: 'Hindi', arabic: 'Arabic', english: 'English',
            korean: 'Korean', telugu: 'Telugu',
            chess: 'Chess', math: 'Math', music: 'Music'
        };

        const targetLanguage = COURSE_ID_TO_LANG[courseId] || 'English';
        const courseType = ['chess', 'math', 'music'].includes(courseId) ? courseId : 'language';

        // Resolve the learner's own language for localized meanings.
        function resolveLanguage(name) {
            const raw = String(name || '').trim();
            const table = [
                [/hindi|हिंदी|हिन्दी/i, 'Hindi'], [/telugu|తెలుగు/i, 'Telugu'], [/korean|한국어/i, 'Korean'],
                [/japanese|日本語|nihongo/i, 'Japanese'], [/arabic|العربية/i, 'Arabic'], [/spanish|español|espanol/i, 'Spanish'],
                [/french|français|francais/i, 'French'], [/german|deutsch/i, 'German'], [/italian|italiano/i, 'Italian'],
                [/english/i, 'English']
            ];
            for (const [pattern, language] of table) if (pattern.test(raw)) return language;
            return raw || 'English';
        }

        const profile = safeParse('MusalingoProfile', {});
        const activeCourse = (() => {
            const courses = Array.isArray(profile.courses) ? profile.courses.filter(c => c && typeof c === 'object') : [];
            if (!courses.length) return null;
            if (profile.activeCourseId) {
                const match = courses.find(c => c.id === profile.activeCourseId);
                if (match) return match;
            }
            return courses[0];
        })();
        const audienceLanguage = resolveLanguage(activeCourse?.speakerLanguage || 'English');

        function localizeMeaning(meaning) {
            const text = String(meaning ?? '').trim();
            const dictionary = window.MusalingoAudience?.translations?.[audienceLanguage];
            return dictionary?.[text.toLowerCase()] || text;
        }

        function isMastered(word) { return (Number(word.box) || 1) >= 4; }

        function getLessonWords() {
            const practice = safeParse('MusalingoPracticeData', {});
            const words = Array.isArray(practice.words) ? practice.words : [];
            return words
                .filter(w => w && typeof w === 'object'
                    && w.courseId === courseId
                    && typeof w.word === 'string' && w.word
                    && typeof w.meaning === 'string' && w.meaning
                    && !w.starter)
                // If a word carries a unit/section, prefer those that match this page.
                // Words without unit metadata are shown for all sections (graceful fallback).
                .filter(w => {
                    const u = w.unit ?? w.section;
                    if (u == null) return true;
                    return String(u) === String(sectionNo);
                })
                .sort((a, b) => (Number(a.box) || 1) - (Number(b.box) || 1)
                    || (a.lastPracticed || 0) - (b.lastPracticed || 0));
        }

        function getStarterWords() {
            if (courseType !== 'language') return [];
            const map = window.MusalingoQuestions?.englishTranslations?.[targetLanguage];
            if (!map || typeof map !== 'object') return [];
            return Object.entries(map).map(([word, meaning]) => ({
                key: `${courseId}|${word}`,
                courseId,
                word,
                meaning,
                pronunciation: '',
                seen: 0,
                correct: 0,
                wrong: 0,
                box: 1,
                starter: true
            }));
        }

        function getBankWords() {
            const mine = getLessonWords();
            const known = new Set(mine.map(w => w.key));
            const allPractice = (safeParse('MusalingoPracticeData', {}).words || []);
            const progressed = new Map(
                allPractice.filter(w => w && w.courseId === courseId).map(w => [w.key, w])
            );
            const starters = getStarterWords()
                .filter(w => !known.has(w.key))
                .map(w => progressed.get(w.key) || w);
            return [...mine, ...starters];
        }

        function speak(text, language, rate = 0.9) {
            const value = String(text || '').trim();
            if (!value) return;
            try {
                if (window.SFX && typeof window.SFX.pronounce === 'function') {
                    window.SFX.pronounce(value, { lang: language, rate });
                    return;
                }
            } catch (err) { /* fall through */ }
            try {
                if (!('speechSynthesis' in window)) return;
                window.speechSynthesis.cancel();
                const u = new SpeechSynthesisUtterance(value);
                u.lang = LANGUAGE_CODES[language] || 'en-US';
                u.rate = rate;
                window.speechSynthesis.speak(u);
            } catch (err) { /* no voice */ }
        }

        // ---------- 5. RENDER ----------
        document.getElementById('guideTitle').textContent = guide.title;
        document.getElementById('guideIntro').textContent = guide.intro;
        document.getElementById('heroArt').textContent = guide.art || '🧑‍🎨';

        document.getElementById('backLink').href =
            `sections.html?courseId=${encodeURIComponent(courseId)}`;

        // Practice CTA — pass course + section so practice can land on the right course.
        const practiceUrl = `practice.html?courseId=${encodeURIComponent(courseId)}&section=${encodeURIComponent(sectionNo)}`;
        document.getElementById('practiceCta').href = practiceUrl;
        document.getElementById('footerPracticeCta').href = practiceUrl;

        // --- Curated phrases ---
        const phraseList = document.getElementById('phraseList');
        const phrasesCount = document.getElementById('phrasesCount');
        if (!guide.phrases.length) {
            phraseList.innerHTML = `<div class="hint"><strong>No key phrases yet</strong>This unit doesn't have curated phrases. Check the words below from your lessons.</div>`;
            phrasesCount.textContent = '';
        } else {
            phrasesCount.textContent = `${guide.phrases.length} phrase${guide.phrases.length === 1 ? '' : 's'}`;
            phraseList.innerHTML = guide.phrases.map((p, i) => `
                <div class="phrase" data-idx="${i}">
                    <button class="speaker-btn" data-idx="${i}" aria-label="Play audio">🔊</button>
                    <div class="phrase-text">
                        <div class="phrase-target">${esc(p.target)}</div>
                        <div class="phrase-en">${esc(p.en)}</div>
                    </div>
                </div>
            `).join('');
        }

        // --- Lesson words ---
        const wordList = document.getElementById('wordList');
        const wordsCount = document.getElementById('wordsCount');
        const bank = getBankWords();
        if (!bank.length) {
            wordList.innerHTML = `<div class="hint"><strong>No words from your lessons yet</strong>Finish a lesson and every new word will show up here with its translation.</div>`;
            wordsCount.textContent = '';
        } else {
            const mineCount = bank.filter(w => !w.starter).length;
            const mastered = bank.filter(isMastered).length;
            wordsCount.textContent = `${bank.length} word${bank.length === 1 ? '' : 's'} · ${mineCount} from your lessons · ${mastered} mastered`;
            wordList.innerHTML = bank.map((w, i) => {
                const meaning = localizeMeaning(w.meaning);
                const masteredBadge = isMastered(w) ? '<span class="badge mastered">★ Mastered</span>' : '<span class="badge learning">Learning</span>';
                const starterBadge = w.starter ? '<span class="badge starter">Starter</span>' : '';
                const stats = (!w.starter && (w.correct || w.wrong))
                    ? `<span class="badge stat">✓${finiteInt(w.correct, 0)} ✗${finiteInt(w.wrong, 0)}</span>`
                    : '';
                return `
                    <div class="phrase" data-word-idx="${i}">
                        <button class="speaker-btn" data-word-idx="${i}" aria-label="Listen to ${esc(w.word)}">🔊</button>
                        <div class="phrase-text">
                            <div class="phrase-target">${esc(w.word)}${w.pronunciation ? ` <span style="color:var(--muted);font-weight:600;font-size:.8rem;">${esc(w.pronunciation)}</span>` : ''}</div>
                            <div class="phrase-en">${esc(meaning)}</div>
                            <div class="word-meta">${masteredBadge}${starterBadge}${stats}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // --- Tip ---
        if (guide.tip) {
            const tipBlock = document.getElementById('tipBlock');
            tipBlock.innerHTML = guide.tip;
            tipBlock.hidden = false;
        }

        // --- Footer CTA ---
        if (bank.length || guide.phrases.length) {
            const footer = document.getElementById('footerCta');
            footer.hidden = false;
            document.getElementById('footerCtaTitle').textContent =
                courseType === 'language' ? `Ready to make these ${bank.length} words stick?` : 'Ready to practice?';
            document.getElementById('footerCtaCopy').textContent =
                courseType === 'language'
                    ? 'Review them as flashcards or a quick quiz in Practice.'
                    : `Open Practice for ${COURSE_ID_TO_DISPLAY[courseId] || 'this course'}.`;
        }

        // ---------- 6. EVENT HANDLERS ----------
        // Curated phrases: tap anywhere on row or the speaker button.
        phraseList.addEventListener('click', (e) => {
            const btn = e.target.closest('.speaker-btn');
            const row = e.target.closest('.phrase');
            if (!btn && !row) return;
            const idx = Number((btn || row).dataset.idx);
            const phrase = guide.phrases[idx];
            if (!phrase) return;
            speak(phrase.target, targetLanguage, 0.85);
        });

        // Lesson words: same interaction pattern.
        wordList.addEventListener('click', (e) => {
            const btn = e.target.closest('.speaker-btn');
            const row = e.target.closest('.phrase');
            if (!btn && !row) return;
            const idx = Number((btn || row).dataset.wordIdx);
            const word = bank[idx];
            if (!word) return;
            speak(word.word, targetLanguage, 0.85);
        });

        // "Play all" — queue curated phrases, then fall back to first 5 words.
        const speakAllBtn = document.getElementById('speakAllBtn');
        if (speakAllBtn) {
            speakAllBtn.addEventListener('click', () => {
                const items = guide.phrases.length
                    ? guide.phrases.map(p => p.target)
                    : bank.slice(0, 5).map(w => w.word);
                if (!items.length) return;
                let i = 0;
                const next = () => {
                    if (i >= items.length) return;
                    const text = items[i++];
                    speak(text, targetLanguage, 0.85);
                    // Rough pacing: ~350ms per word + 800ms buffer. Good enough for
                    // SFX.pronounce; if SFX exposes an onend hook, swap this out.
                    setTimeout(next, 350 * Math.max(1, String(text).split(/\s+/).length) + 800);
                };
                next();
            });
        }
    </script>

    <script src="theme.js"></script>
    <script src="bloat.js"></script>
    <script src="pwa.js" defer></script>
